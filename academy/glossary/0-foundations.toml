# ---------------------------------------------------------------- executable files

[[term]]
term = "magic bytes"
aliases = ["magic number", "magic numbers", "file signature"]
short = "Fixed bytes at the start of a file that identify its format, like 4D 5A (MZ) for Windows programs."
text = '''
| format | first bytes |
|---|---|
| PE (Windows) | `4D 5A` (`MZ`) |
| ELF (Linux) | `7F 45 4C 46` (`.ELF`) |
| Mach-O (macOS, 64-bit) | `CF FA ED FE` |
'''
see = ["header", "executable"]

[[term]]
term = "header"
aliases = ["headers"]
short = "A block of fields at a fixed place in a file that describes the rest of the file."
text = '''
An executable's headers say which CPU it is for, whether it is 32- or 64-bit, where the entry point is, which sections there are and where the import table is. The **Info** view reads them for you.
'''
see = ["magic bytes", "section", "entry point"]

[[term]]
term = "section"
aliases = ["sections"]
short = "A named block of an executable, such as .text for code or .rdata for read-only data, loaded into memory as one area."
text = '''
Each section has a start in the file, a start in memory, a size and permissions (read, write, execute). Typical Windows sections are `.text`, `.rdata`, `.data`, `.pdata` and `.reloc`. The **Sections** view lists them.
'''
see = ["header", "executable"]

[[term]]
term = "program loader"
aliases = ["operating system's loader", "Windows loader"]
short = "The part of the operating system that reads an executable, copies its sections into memory, connects its imports and starts it."
