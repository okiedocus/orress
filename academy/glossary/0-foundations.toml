[[term]]
term = "optimization"
aliases = ["optimizations", "optimize", "optimizes", "optimized", "optimizer", "optimizing"]
short = "The compiler rewriting code into something faster that gives the same results."
text = '''
Common optimizations are constant folding (`2 + 3` becomes `5`), inlining (copying a small function into its caller) and removing dead code. Optimized code often looks quite different from the source.
'''
see = ["constant folding", "inlining", "dead code", "release build"]

[[term]]
