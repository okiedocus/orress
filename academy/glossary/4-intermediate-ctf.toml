term = "CPython"
aliases = ["Python bytecode", "CPython bytecode"]
short = "The standard Python interpreter, which compiles .py source to bytecode and runs it."
see = ["pyc", "managed runtime"]

[[term]]
term = "pyc"
aliases = [".pyc", "pyc file", "pyc files"]
short = "A compiled Python file: a version-specific 4-byte magic number (ending 0D 0A), a header, and marshalled code objects."
see = ["CPython", "PyInstaller"]

[[term]]
term = "PyInstaller"
short = "A tool that packs a Python program and the Python runtime into one .exe. Inside are .pyc files you can extract."
see = ["pyc"]

[[term]]
term = "WebAssembly"
aliases = ["Wasm", ".wasm"]
short = "A low-level stack bytecode for browsers and standalone runtimes; C, C++ and Rust compile to it. Starts with 00 61 73 6D."
see = ["WAT", "linear memory", "bytecode"]

[[term]]
term = "WAT"
aliases = ["WebAssembly Text"]
short = "The readable text form of WebAssembly, with instructions such as local.get, i32.const and i32.xor."
see = ["WebAssembly"]

[[term]]
term = "linear memory"
aliases = ["Wasm memory"]
short = "A WebAssembly module's memory: one big array of bytes that all its loads and stores use."
see = ["WebAssembly"]

[[term]]
term = "JavaScript"
aliases = ["JS", ".js"]
short = "The language of web pages, shipped as source text, so it is minified or obfuscated instead of compiled."
see = ["minification"]

[[term]]
term = "minification"
aliases = ["minified", "minify", "minifier"]
short = "Shrinking source code by removing whitespace and shortening names to a, b, c. A beautifier puts the layout back."
see = ["JavaScript", "beautify"]

[[term]]
term = "beautify"
aliases = ["beautifier", "beautified", "pretty-print"]
short = "Re-indenting and re-formatting minified code so it becomes readable again."
see = ["minification"]

[[term]]
term = "ConfuserEx"
aliases = ["ProGuard"]
short = "Obfuscators for managed code (ConfuserEx for .NET, ProGuard for Java) that rename symbols, encrypt strings and scramble control flow."
see = ["obfuscation", "managed code"]
