id = "l2-decompiler"
level = 2
order = 6
title = "The decompiler"
summary = "Read machine code as Rust: what the decompiler gets right, where it guesses wrong, and how you use it to solve crackme #10."
goals = [
    "open the decompiler (F5) and move between it and the disassembly",
    "read decompiled Rust: parameters, local variables, slices, character literals",
    "spot the typical mistakes of a decompiler and check them in the disassembly",
    "know what the Rust port mode is for",
    "solve crackme #10 by reading its decompiled checks",
]
badge = "Decompiled"
reveal_source = "crackme10"

[[steps]]
title = "Assembly, but readable"
goal = "Understand what a decompiler does and what it cannot do."
text = '''
In Level 1 you read assembly one instruction at a time. That works, but it is slow: one
line of Rust easily becomes ten instructions, and you have to keep all registers in your
head.

A **decompiler** does the opposite of a compiler. It reads the machine code of one
function, follows the data through the registers and the stack, and rebuilds code with
`if`, `while`, variables and function calls. ORRESS writes that code **in Rust syntax**,
so it looks like code you write yourself. This kind of rebuilt code is called
**pseudocode**: it shows what the function does, but it is not the original source.

Why not the original? Because compiling throws information away for good:

- **names**: of functions, variables and fields (in a stripped program);
- **types**: in machine code, a `&str`, a `&[u8]` and a `Vec<u8>`'s data are all "a
  pointer and a length";
- **structure**: the compiler copies small functions into their callers (inlining),
  reorders code, and merges or removes variables;
- **comments**: never stored at all.

So the decompiler has to *guess* names and types. Its guesses are usually good, and
sometimes wrong. This lesson shows you how to use it to read fast, and how to catch its
mistakes.
'''

[[steps]]
title = "Open crackme #10"
goal = "Have the practice program open."
text = '''
