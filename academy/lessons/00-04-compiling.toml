id = "l0-compiling"
level = 0
order = 4
title = "From Rust to machine code"
summary = "What the compiler produces, and what it throws away."

[[steps]]
title = "A function, three ways"
text = '''
Here is a tiny Rust function:

```rust
pub fn add(a: u64, b: u64) -> u64 {
    a + b
}
```

`cargo build --release` for 64-bit Windows turns it into two **instructions** (assembly) that are really five **bytes** (machine code):

```text
48 8D 04 11     lea rax, [rcx+rdx]   ; rax = a + b
C3              ret                  ; return to the caller
```

- `rcx` and `rdx` are **registers** holding the two arguments.
- `rax` holds the return value.
- `lea` here simply adds. Compilers love such tricks.

The bytes are what is in the file; ORRESS's disassembler turns them back into the readable middle column.
'''

[[steps]]
title = "Where is the result?"
text = '''
Look at the example again. After `lea rax, [rcx+rdx]` and `ret`, which register holds the value the function returns?
'''
check = { kind = "choice", options = ["rcx", "rdx", "rax", "ret"], correct = 2 }
success = "On x86-64 the return value is always in `rax` (or its lower part `eax` / `al`). Remember this one: you will use it constantly."

[[steps]]
title = "An if becomes a comparison"
text = '''
```rust
pub fn is_secret(x: u32) -> bool {
    x == 1337
}
```

compiles to:

```text
cmp ecx, 0x539   ; compare the argument with 0x539
sete al          ; al = 1 if they were equal, else 0
ret
```

Numbers in your code show up in hex in the assembly. What is `0x539` in decimal?
'''
widget = "number_converter"
check = { kind = "answer", answers = ["1337"], number = true }

[[steps]]
title = "What gets lost"
text = '''
Compiling throws a lot away:

- **Names**: `add`, `is_secret` and your variable names are usually gone ("stripped"). ORRESS shows `sub_401000` instead, and you rename functions as you understand them.
- **Types**: the machine only knows sizes (1, 2, 4, 8 bytes), not `bool`, `String` or your structs.
- **Structure**: `if`, `for` and `match` become comparisons and jumps.
- **Optimizations** reorder, merge and inline code, so it rarely looks like the source.

Reverse engineering is the art of rebuilding that lost information. The good news: patterns repeat, and you will learn to spot them.
'''
