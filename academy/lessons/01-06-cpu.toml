id = "l1-cpu"
level = 1
order = 6
title = "Registers and flags"
summary = "The CPU's working memory, and your first program in the simulator."

[[steps]]
title = "Registers"
text = '''
The processor works on **registers**: 16 small slots of 64 bits each, named `rax`, `rbx`, `rcx`, `rdx`, `rsi`, `rdi`, `rbp`, `rsp` and `r8`–`r15`. Think of them as the CPU's local variables:

```rust
let mut rax: u64 = 0;
let mut rbx: u64 = 0;
// ... and so on
```

Some have a job: `rax` holds return values, `rsp` points at the top of the stack. Open the **CPU simulator** to see them: use the **Learn** menu (Learn > Academy: CPU Simulator) or type `simulator` in the command palette.
'''
check = { kind = "action", id = "academy::OpenSimulator" }

[[steps]]
title = "Your first program"
text = '''
`mov` copies a value: `mov rax, 5` is like `rax = 5;`. Write a program in the simulator that puts **5 in rax** and **7 in rbx**, then press **Run**.
'''
spotlight = "sim.code"
sim_code = '''
; Put 5 in rax and 7 in rbx.
; One instruction per line, e.g.:  mov rax, 1
'''
check = { kind = "sim", expect = [["rax", 5], ["rbx", 7]], requires = ["mov"] }
hints = ["Two lines: one mov for each register.", "mov rax, 5"]
solution = '''
mov rax, 5
mov rbx, 7
'''

[[steps]]
title = "Step by step"
text = '''
Press **Reset**, then **Step** a few times instead of Run. The arrow shows the next line, and the register that just changed lights up. Stepping is how reversers (and debuggers) follow a program one instruction at a time. **Step back** undoes a step.
'''
spotlight = "sim.step"

[[steps]]
title = "Flags"
text = '''
After arithmetic and comparisons, the CPU sets **flags**: single bits that remember something about the result.

- **ZF** (zero): the result was 0. After `cmp a, b`: *a equals b*.
- **SF** (sign): the result was negative.
- **CF** (carry): unsigned overflow; after `cmp a, b`: *a < b* as unsigned numbers.
- **OF** (overflow): the signed result did not fit.

`cmp rax, 5` subtracts 5 from rax *only to set the flags*, like `rax == 5` in Rust without storing anything. After `mov rax, 5` and `cmp rax, 5`, which flag is 1? (Try it in the simulator!)
'''
spotlight = "sim.flags"
check = { kind = "choice", options = ["ZF", "SF", "CF", "OF"], correct = 0 }

[[steps]]
title = "Smaller parts of registers"
text = '''
Registers have smaller views: `eax` is the lower 32 bits of `rax` (like `rax as u32`), `ax` 16 bits and `al` 8 bits. A Rust `u32` lives in `eax`, a `u8` or `bool` in `al`.

One surprise: **writing a 32-bit register clears the upper 32 bits**. After `mov rax, -1` and then `mov eax, 1`, what is in `rax`? (Check it in the simulator.)
'''
check = { kind = "answer", answers = ["1"], number = true }
hints = ["The upper half is cleared, the lower half becomes 1."]
