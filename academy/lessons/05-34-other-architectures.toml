title = "Other CPU architectures"
summary = "When the binary isn't x86: RISC vs CISC, fixed-width instructions, and how to step into an unfamiliar ISA like ARM64."
badge = "Polyglot"

[[steps]]
title = "Beyond x86"
text = '''
Most reversing you've done so far is **x86 / x86-64** — the desktop and server world. But a huge amount of code runs on other CPUs: **ARM64 (AArch64)** powers phones, Apple Silicon Macs and many servers; **MIPS**, **RISC-V**, **PowerPC** and **AVR** show up in routers, IoT gear and firmware.

The good news is that the *skill* transfers. Registers, a stack, calling conventions, branches and the compiler's habits are universal — only the spelling changes. Once you've read one architecture, picking up the next is mostly learning a new instruction table.

ORRESS decodes **x86 (32-bit)**, **x86-64** and **ARM64** today. Other embedded ISAs (MIPS, RISC-V…) are on the firmware/hardware track; the approach in this lesson is exactly how you'd tackle them.
'''

[[steps]]
title = "RISC vs CISC"
text = '''
Architectures fall into two broad families:

- **CISC** (x86): a **variable-length** encoding (1 to 15 bytes per instruction), many complex instructions, and arithmetic that can read memory directly (`add rax, [rbx+8]`). Compact code, but messy to decode.
- **RISC** (ARM64, MIPS, RISC-V): **fixed-width** instructions, a smaller, regular instruction set, lots of registers, and a **load/store** rule — arithmetic happens only between registers, and memory is touched only by dedicated `load`/`store` instructions.

That difference shapes how the code looks. RISC programs shuffle values through registers and do explicit loads/stores around every computation, where x86 folds the memory access into the operation.
'''

[[steps]]
title = "Fixed-width instructions"
text = '''
A defining RISC trait is that **every instruction is the same size**. ARM64 (and ARM's older 32-bit mode, and MIPS, and RISC-V's base set) use one fixed width, which makes linear disassembly trivial: you never have to guess where the next instruction starts.

How many **bytes** is a single ARM64 (AArch64) instruction?
'''
check = { kind = "answer", answers = ["4"], number = true }
hints = ["It's a 32-bit instruction word. 32 bits divided by 8 bits per byte.", "ARM64 instructions are 4 bytes each; x86 ranges from 1 to 15."]
success = "4 bytes — fixed. That's why a RISC disassembler can just step 4 bytes at a time, while an x86 one must decode each instruction's length."

[[steps]]
title = "The load/store model"
text = '''
You're reading ARM64 for the first time and you see a value loaded into a register, modified, then stored back, instead of being changed in place in memory. Which statement about RISC explains why?
'''
check = { kind = "choice", options = [
  "Arithmetic works only on registers; memory is reached only through explicit load and store instructions",
  "ARM64 has no registers, so everything lives in memory",
  "ARM64 cannot do arithmetic at all",
  "It is a bug in the compiler",
], correct = 0 }
hints = [
  "Think about what 'load/store architecture' means for where computation can happen.",
  "On x86 you can add straight to memory; on RISC you must load into a register first, compute, then store.",
]
success = "Right — the load/store model forbids arithmetic on memory, so RISC code loads, computes in registers, then stores back."

[[steps]]
title = "ORRESS picks the ISA for you"
text = '''
You don't choose the architecture by hand: when ORRESS loads a file it reads the executable's header (PE, ELF or Mach-O), detects whether it's x86, x86-64 or ARM64, and wires up the right decoder. The **Disassembly**, graph and decompiler views then work the same way they do for x86 — same UI, different instruction set.

Open the **Disassembly** view (Ctrl+D, the View menu, or the command palette) to see the decoded instructions for whatever ISA the file uses.
'''
check = { kind = "action", id = "view::Disassembly" }
spotlight = "view.Disassembly"
hints = ["Ctrl+D opens it — or Ctrl+Shift+P and type \"Disassembly\"."]

[[steps]]
title = "Stepping into an unfamiliar ISA"
text = '''
When you meet an architecture you've never read — a MIPS router firmware, a RISC-V microcontroller dump — the method is always the same:

1. **Grab the reference.** Find the ISA's instruction encoding, register set, calling convention, and **endianness** (MIPS is often big-endian — bytes and words can be reversed from what you expect).
2. **Find the shape.** Locate function **prologues/epilogues** and the calling convention (which registers pass arguments, which holds the return value, how the return address is saved).
3. **Follow control flow.** Identify the branch and call instructions and how syscalls are made — that's enough to map the program.
4. **Lean on fixed width.** On RISC, disassembly is reliable, so linear or recursive decoding just works; focus your energy on semantics, not on finding instruction boundaries.
5. **Emulate to confirm.** Run tricky sequences in an emulator for that ISA and watch the registers, exactly as you did for x86.

RISC vs CISC, fixed vs variable width, the load/store rule, and a repeatable method for any new ISA — architecture is no longer a wall between you and the code.
'''
