id = "l2-graph"
level = 2
order = 5
title = "The graph view: code as a picture"
summary = "Basic blocks and arrows: read ifs, if/else and loops as shapes, so you see a function's structure before you read its instructions."
goals = [
    "explain what a basic block and a control-flow graph are",
    "read the colours of the arrows: taken, not taken, always",
    "recognise an if, an if/else, a chain of checks and a loop by their shape",
    "move between the graph and the linear disassembly with Space",
]
badge = "Graph Reader"

[[steps]]
title = "From lines to boxes"
goal = "Understand basic blocks and the control-flow graph."
text = '''
The disassembly is a long list. Jumps make you hop up and down in it, and after three
jumps you have lost track. The **graph view** draws the same function as a picture.

It cuts the function into **basic blocks**: runs of instructions that always execute
together, from top to bottom. A block ends at a jump (or a `ret`), and a new block starts
wherever a jump can land. Inside a block nothing can branch, so you can read it as one
small step.

Then it draws an **arrow** (a *graph edge*) for every way to get from one block to the
next. Boxes plus arrows form the function's **control-flow graph**.

Take this Rust code:

```rust
if code.len() != 6 {
    return false;          // block B
}
return code[0] == b'K';    // block C
```

The compiled code has block A (`cmp rdx,6` / `jne B`), block B and block C. From A there
are two arrows: to B when the jump is taken (the length is not 6), and to C when it is not
taken and the CPU simply continues below (*fall-through*).

ORRESS colours the arrows:

- **green**: the conditional jump is **taken** (its condition is true);
- **red**: the jump is **not taken** (execution falls through to the next block);
- **blue**: always, either an unconditional `jmp` or plain fall-through.
'''

