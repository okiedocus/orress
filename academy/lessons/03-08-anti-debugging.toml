[[steps]]
title = "Programs that fight back"
goal = "Know what anti-debugging is and why programs do it."
text = '''
Some programs notice when they are being debugged and **change what they do** to throw you off: they exit, take a fake path, quietly corrupt the answer, or just do nothing interesting. Crackmes do it to frustrate you; malware does it to **hide its real behaviour** from an analyst.

This is **anti-debugging**, the last core dynamic-analysis skill in this level. The tricks look intimidating, but they share one fatal weakness, and once you see it, most of them fall in a single patch.

The job is always the same two steps: **recognise** the check, then **neutralise** it.

In this lesson you take crackme #4. Run it under the debugger and it always says "Debugger detected", even when your password is right. You will find the check, find the password, and patch past the trap so you can analyse it like any other program.
'''

[[steps]]
title = "How a program spots a debugger"
goal = "Learn the common detection tricks."
text = '''
The usual ways a program detects a debugger:

- **API calls.** On Windows, `IsDebuggerPresent`, `CheckRemoteDebuggerPresent`, or `NtQueryInformationProcess` (asking for the debug port). The program just asks the operating system.
- **Reading the PEB directly.** The debugger flag lives in a structure the process owns (the Process Environment Block). A program can read the `BeingDebugged` byte there itself, with **no API call** to spot.
- **ptrace.** On Linux, a process tries to `ptrace` itself; if that fails, something else is already tracing it.
- **Timing.** Read the clock before and after a short block of code. Under a debugger that is single-stepping, the gap is huge, which gives the debugger away.
- **Breakpoint scanning.** The program checks its own code for the `0xCC` byte that a software breakpoint leaves behind.

Different mechanisms, same end: each produces a yes/no "is a debugger here?" that the program then acts on.
'''

[[steps]]
title = "The weakness they share"
goal = "See what makes every anti-debug check beatable."
text = '''
However a check detects the debugger, the result is useless to the program unless it *does something* with it. What is the weakness every anti-debug trick shares?
'''
check = { kind = "choice", options = [
    "It ends in a branch: find the jump the check controls and you can force the program onto the 'no debugger' path",
    "Anti-debug checks are mathematically unbreakable once compiled",
    "They force you to give up debugging and read the code only statically",
    "They only work on Linux, so switching to Windows avoids them",
], correct = 0, explain = [
    "Right. A yes/no answer is worthless unless the program branches on it, and a branch is something you can see, understand and patch, exactly as you did in the patching lesson.",
    "They are just code. A detection feeds a branch, and a branch can be changed.",
    "Static reading helps you find the check, but you do not have to give up running the program: you neutralise the branch.",
    "The same idea (API, PEB, ptrace, timing) exists on every system. The platform is not the escape; the branch is.",
] }
hints = [
    "The detection result is useless unless the program acts on it. How does code act on a yes/no?",
    "Every check is followed by a conditional jump you can see and change.",
]
success = '''
Detection is pointless without a branch to act on it, and a branch is something you can see, understand and change. Recognise the check, find its branch, patch it.
'''

[[steps]]
title = "Triage flags it"
goal = "Use the Triage report to recognise the anti-debugging."
text = '''
ORRESS helps you recognise anti-debugging before you even run the program. Open crackme #4 and open the **Triage** view.

Because the program imports a debugger-detection API, Triage classifies it as **"a challenge that resists debugging"**, lists the capability **"Check for a debugger"** tagged with MITRE ATT&CK **T1622 (Debugger Evasion)**, and its graded hints tell you to **locate the anti-debug check (IsDebuggerPresent, a PEB flag, ptrace, or a timing check) and see what branch it controls**.

That is your recognise step done for you. From there you cross-reference the flagged API to find the exact check in the code.
'''
instructions = [
