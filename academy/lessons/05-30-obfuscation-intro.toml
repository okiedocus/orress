[[steps]]
title = "The strategy that beats all of them"
goal = "Lock in the general method for the rest of the level."
text = '''
Every lesson in this level comes back to one idea. When the static view is a lie —
flattened, virtualized, packed, or self-modifying — what do you do?
'''
check = { kind = "choice", options = [
  "Make the program reveal the real behaviour (run or emulate it, or let ORRESS deobfuscate), then analyse that",
  "Give up; obfuscated code cannot be reversed",
  "Only ever read the raw bytes harder until it makes sense",
  "Delete the obfuscated function and hope the program still works",
], correct = 0, explain = [
  "Exactly — the behaviour must appear at run time, so you force it into the open and analyse the result.",
  "Wrong — obfuscation slows you down, it does not stop you. The behaviour is always recoverable.",
  "Wrong — for flattening, VMs, packing and self-modifying code, the raw bytes are meant to mislead. Reading harder is not the move.",
  "Wrong — and you usually only have the file to read, not to edit into working again.",
] }
success = "That is the whole level in one sentence: when reading fails, make the code show you — then read what it showed. Now on to the first technique, control-flow flattening."
