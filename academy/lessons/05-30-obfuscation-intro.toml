[[steps]]
title = "Code that fights back"
goal = "Understand what obfuscation is and why it exists."
text = '''
Everything you have reversed so far tried, more or less, to be readable. This level is
about code that **actively resists** you.

**Obfuscation** rewrites a program into an equivalent one that is far harder to
understand. The behaviour does not change — same inputs, same outputs — only the *shape*
is scrambled. Think of it as the same Rust function put through a machine that makes it
unreadable while keeping what it computes.

People obfuscate for three reasons:

- **Protection.** Commercial software hides licence checks and secret algorithms so
  competitors and crackers cannot copy or bypass them.
- **Malware.** Attackers hide what their code does, so scanners miss it and analysts (you)
  waste time.
- **CTFs.** Challenge authors obfuscate on purpose, because peeling it apart is the puzzle.

The good news: obfuscation cannot change what the program *does*, only how it looks. The
behaviour is still in there, and at run time the CPU has to un-hide it to execute it. That
single fact is the crack you will use again and again in this level.
'''

[[steps]]
title = "The families you will meet"
goal = "Recognise the main kinds of obfuscation by name."
text = '''
Obfuscation comes in a handful of families. You will meet all of these in this level:

- **Opaque predicates** — fake branches guarded by a condition that is always true or
  always false, to bury the real path among dead ones.
- **Junk code** — instructions added only to pad and distract; they compute nothing that
  is used.
- **Control-flow flattening** — a function's `if`s and loops are chopped into one big
  dispatch loop driven by a **state variable**, so you cannot read it top to bottom.
- **VM-based obfuscation** — the real code is replaced by **bytecode for a made-up CPU**,
  plus an **interpreter** that runs it. The logic becomes data.
- **Packing** — the whole program is compressed or encrypted into a blob, with a small
  **unpacking stub** that restores it at run time.
- **Self-modifying code** — the program writes new instructions into its own code while
  running, then jumps into them.

They are often stacked: a packed binary whose unpacked code is virtualized and guarded by
opaque predicates. You peel them one layer at a time.
'''
deep_dive = '''
These are not just CTF toys. Commercial protectors like **VMProtect** and **Themida**
combine virtualization, flattening and anti-analysis; packers like **UPX** are everywhere;
and real malware layers packing over self-modifying loaders. The techniques scale; the tiny
examples in this level teach the exact method you would use on the large ones.
'''

[[steps]]
title = "What obfuscation can and cannot do"
goal = "Pin down the one thing obfuscation can never hide."
text = '''
Keep one idea front of mind before you pick a tool. Which statement is true?
'''
check = { kind = "choice", options = [
  "Obfuscation changes how code looks but not what it computes, and the CPU must un-hide it to run it",
  "Obfuscation changes what the program computes, so the original behaviour is lost",
  "Obfuscated code can never be run, only read",
  "Obfuscation only renames variables and nothing else",
], correct = 0, explain = [
  "Correct — the behaviour is preserved and revealed at run time; that is the weakness you exploit.",
  "Wrong — if it changed the behaviour the program would break. Obfuscation preserves behaviour by definition.",
  "Wrong — it runs perfectly; the CPU has to execute the real logic, which is exactly how you catch it.",
  "Wrong — renaming is the weakest trick. This level is about far stronger ones: flattening, VMs, packing, self-modifying code.",
] }
success = "The behaviour survives obfuscation and the machine reveals it at run time. When reading is too hard, you make the program show you."

[[steps]]
title = "How ORRESS helps"
goal = "Know which ORRESS features fight obfuscation."
text = '''
You are not doing this bare-handed. ORRESS fights obfuscation on two fronts:

- **Triage** recognises obfuscation by its shape. It flags **VM-based obfuscation** (a
  high-fan-in dispatcher loop that looks like an interpreter), reports **packing** (a
  high-entropy executable section or a known packer signature), and lists other risk
  flags. For a flagged VM it even recovers the opcode table, the bytecode and, when it
  can, the hidden key.
- The **decompiler** quietly deobfuscates as it works. It folds away opaque predicates it
  can prove constant and undoes control-flow flattening, relinking the dispatcher arms
  into their real order. When it reshapes a function it prints a header note:
  `// deobfuscated by ORRESS: ... undone`, so you know the clean code you are reading
  differs from the raw bytes.

Across the next lessons you will use both: Triage to *spot* the obfuscation, the
decompiler and the emulator to *undo* it.
'''

