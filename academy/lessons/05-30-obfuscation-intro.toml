[[steps]]
title = "Point Triage at it"
goal = "Open the Triage report and see obfuscation called out."
text = '''
**Triage** is ORRESS's one-screen summary of a file: what it is, what it can do, and
anything suspicious — including obfuscation. Open it for the crackme you just loaded.

In Triage's **VM-based obfuscation** section you will see Crackme #8 flagged: its check
function is shaped like an interpreter/dispatcher, so ORRESS reports the dispatcher
address, how many handlers branch back to it, and a confidence score. (Crackme #8 is
control-flow-flattened, which produces the same high-fan-in dispatcher shape — you will
unflatten it properly in the next lesson.)
'''
