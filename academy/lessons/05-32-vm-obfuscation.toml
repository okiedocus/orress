VM — open it, then open **Triage**.

When a function matches the interpreter pattern, Triage shows a **VM-based obfuscation**
section listing the likely interpreter: its address, the **dispatcher** block, how many
**handlers** branch back to it, and a confidence score. For crackme #5 you will also see
an **opcode table & bytecode** panel — ORRESS has already recovered the instruction set
and the virtual program. (You will reverse that yourself, by hand, in the next lesson; for
now just confirm ORRESS found the VM.)
'''
instructions = [
