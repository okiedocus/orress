id = "l5-vm-obfuscation"
level = 5
order = 32
title = "VM-based obfuscation"
summary = "How virtual-machine protections hide code as bytecode, how to spot the interpreter, and how ORRESS flags it."
badge = "VM Hunter"
goals = [
    "explain how VM-based obfuscation turns code into bytecode plus an interpreter",
    "recognise an interpreter from its high-fan-in dispatcher loop",
    "find and read ORRESS's VM-based obfuscation report in Triage",
    "describe the path from spotting a VM to devirtualizing it",
]

[[steps]]
title = "When the code becomes data"
goal = "Understand what a VM protection replaces the code with."
text = '''
You have now seen flattening scramble a function's *order*. **VM-based obfuscation**
(virtualization) goes further: it throws the function's machine code away entirely and
replaces it with **bytecode for a made-up CPU**, bundled with a small **interpreter** that
runs that bytecode.

Compare it to Rust. Your source compiles to x86 machine code the CPU runs directly. A VM
protector instead compiles the function to its *own* invented instruction set — a blob of
bytes nobody's disassembler understands — and ships an interpreter that walks those bytes
and does what each one says.

The effect on you: open the protected function and your disassembler shows the
**interpreter**, not the logic. The real algorithm is now **data** — a blob of custom
opcodes — so you cannot just read it off the screen. Commercial protectors **VMProtect**
and **Themida** work this way, and CTF authors love hand-rolling tiny versions.

The weakness: an interpreter has a very recognisable shape, and once you find it you can
start to unwind it.
'''

[[steps]]
title = "The dispatch loop"
goal = "Learn the interpreter shape you will hunt for."
text = '''
Every bytecode interpreter has the same core, the **fetch-decode-execute** loop:

```rust
loop {
    let opcode = code[vpc];   // fetch the next virtual instruction
    vpc += 1;                 // advance the virtual program counter
    match opcode {            // decode: jump to the handler for it
        0 => { /* handle add  */ }
        1 => { /* handle push */ }
        // ... dozens more ...
    }
}
```

The `match` is the **dispatcher**. Each arm is a **handler** that performs one virtual
instruction, then **loops back to the dispatcher** for the next opcode.

So in the control-flow graph the dispatcher is a single block that *many* handler blocks
branch back to — a very high **fan-in** — and the whole thing sits inside a loop. That
shape is the fingerprint of a VM. (It is the same fingerprint flattening has, because a
flattened function is really just an interpreter for "which block runs next".)
'''

[[steps]]
title = "Spotting the interpreter"
goal = "Pick the strongest signal that a function is an interpreter."
text = '''
You are staring at a large, confusing function. Which of these most strongly says "this is
a VM interpreter"?
'''
check = { kind = "choice", options = [
  "One block that dozens of other blocks jump back to, inside a loop (a high-fan-in dispatcher)",
  "The function is long",
  "It calls many imported functions",
  "It contains floating-point instructions",
], correct = 0, explain = [
  "Right — a central, high-fan-in dispatcher inside a loop is the interpreter's signature.",
  "Wrong — plenty of ordinary functions are long. Length alone says nothing about virtualization.",
  "Wrong — interpreters often call almost nothing; the work is inside the handlers. Many imports points elsewhere.",
  "Wrong — floating-point is unrelated; a VM can run entirely on integers.",
] }
hints = [
  "Think about the dispatch loop: handlers run, then return to one central block.",
  "Length and imports are weak signals; the dispatcher's fan-in is the giveaway.",
]
success = "Exactly — a central, high-fan-in dispatcher inside a loop is the interpreter's signature, and it is exactly what ORRESS scans for."

