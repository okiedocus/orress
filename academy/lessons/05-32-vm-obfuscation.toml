[[steps]]
title = "What counts as a VM"
goal = "Understand the handler-count threshold ORRESS uses."
text = '''
ORRESS reports the **dispatcher** address as your anchor: that is where the `match` lives,
and every handler branches back to it.

A real VM has one handler per virtual opcode, so its dispatcher usually fans out to 10+
handlers, often 50+. Tiny CTF VMs can be leaner, so ORRESS's detector uses a lower floor:
a dispatcher must branch out to at least a minimum number of handlers that loop back to it
before it is reported as a VM rather than an ordinary `switch`.

What is that minimum — the smallest handler count ORRESS will still flag as a VM? (Type a
single number.)
'''
instructions = [
  "Type the minimum number of handlers ORRESS requires before it flags a dispatcher as a VM.",
  "Press Check.",
]
check = { kind = "answer", answers = ["6"], number = true }
hints = [
  "It is well below the 10+ of a typical VM, so tiny CTF interpreters are still caught.",
  "It is a single-digit number just above a handful.",
  "ORRESS's threshold is 6 handlers.",
]
success = "Right: six handlers looping back to one dispatcher is already a VM shape to ORRESS, and real VMs (one handler per virtual opcode) usually have far more."

[[steps]]
title = "From detection to devirtualization"
goal = "See the whole path you will walk next lesson."
text = '''
Finding the VM is step one. **Devirtualizing** it — turning the bytecode back into
readable code — is the real work:

1. **Find the dispatcher** (ORRESS does this for you).
2. **Map the handlers**: for each opcode, read what its handler does (push, add, xor,
   compare, jump...). This builds the VM's **opcode table** — its instruction set.
3. **Locate the bytecode** and the **virtual program counter** the interpreter reads.
4. **Lift**: walk the bytecode, emit the equivalent real operation per opcode, and you
   have recovered the original program.

The **Emulator** helps a lot here: run the interpreter in it, watch which handler each
opcode reaches, and record the effects. You now know what a VM protection is, what its
interpreter looks like, how ORRESS flags it, and the path to peeling it apart. Next lesson
you walk that path on crackme #5 and recover its key.
'''
