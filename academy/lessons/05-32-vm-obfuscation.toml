  "Open the **Triage** view: **Ctrl+Shift+T**, or **View** menu -> **Open View** -> **Open Triage Report**.",
  "Find the **VM-based obfuscation** heading and read the flagged interpreter line.",
]
spotlight = "view.Triage"
check = { kind = "open_crackme", name = "crackme05" }
hints = [
  "Open the crackme first, then Triage (Ctrl+Shift+T).",
  "The VM-based obfuscation section is near the top of the report; it names the dispatcher address and the handler count.",
