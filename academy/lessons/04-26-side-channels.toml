id = "l4-side-channels"
level = 4
order = 26
title = "Side channels"
summary = "Secrets leak through how a program behaves, not just what it outputs — recover a flag one byte at a time by instruction counting."
badge = "Leak Hunter"

[[steps]]
title = "Secrets leak sideways"
text = '''
A check can be perfectly tight-lipped in its output — just "Access denied", the same every time — and still **give the secret away**. Not through what it says, but through **how it behaves** while deciding: how long it takes, how much power it draws, how its cache warms, how many instructions it executes.

These are **side channels**: the secret leaks through a *measurable side-effect* of the computation. The program never means to tell you anything, but the shape of its work depends on the secret, and you can watch that shape.

In this lesson you'll use the most beginner-friendly one — **instruction counting** — to pull a flag out of a check that never once returns "correct".
'''

[[steps]]
title = "The leak in a naive compare"
text = '''
Look at how a lazy flag check is written:

```text
for i in 0..len {
    if input[i] != flag[i] {
        return false;      // bail out on the FIRST wrong byte
    }
}
return true;
```

The bug isn't in the logic — it's in the **early exit**. A wrong *first* byte makes the loop bail immediately. A *correct* first byte lets the loop run on to check the second byte. So **how far the loop gets depends on how many leading bytes you got right.**

That early-exit turns an all-or-nothing check into a **per-byte oracle**: the further the check runs, the more of your prefix is correct. Measure "how far it got" and you can feel your way to the flag.
'''

[[steps]]
title = "One byte at a time"
text = '''
You have an oracle that tells you how far the check ran. How do you turn that into the whole flag?
'''
check = { kind = "choice", options = [
  "Fix the known prefix, try every candidate for the next position, keep the one that makes the check run furthest, then repeat for the next position",
  "Guess the entire flag in one go",
  "Brute-force every possible full-length string",
  "Read the system clock",
], correct = 0 }
hints = [
  "You recover the flag left to right, locking in one byte before moving on.",
  "At each position, the winning byte is the one that makes the routine run the furthest.",
]
success = "Right — recover it position by position: the byte that makes the check run furthest is correct, so lock it in and move right. Linear work instead of exponential brute force."

[[steps]]
title = "Side-channel solve in ORRESS"
text = '''
ORRESS automates exactly this. The **Emulator** tab has a **Side-channel solve** section: give it the **check function**, the **input length**, and a **charset** (printable, alphanumeric, or digits). Press **Solve** and it emulates each candidate byte at each position, **counts the executed instructions**, and keeps the byte with the highest count — recovering the input byte-by-byte **without ever passing the final check**.

It even shows a **per-position table** with each chosen byte, its count, and the runner-up's count, so you can see how clear the signal was.

Open the **Emulator** tab (F7, the View menu, or the command palette) and find the Side-channel solve section.
'''
check = { kind = "action", id = "view::Emulator" }
spotlight = "view.Emulator"
hints = ["F7 opens it — or Ctrl+Shift+P and type \"Emulator\". Scroll to the Side-channel solve heading."]

[[steps]]
title = "What the oracle measures"
text = '''
In a real attack the oracle might be wall-clock time, and it's noisy — you'd average many runs to see the signal. ORRESS runs the check in its **emulator** instead, which gives a perfect, noise-free measure of "how far it got": it counts a single, exact quantity per candidate.

What does the solver count to measure how far the check ran? (One word.)
'''
check = { kind = "answer", answers = ["instructions", "instruction"], number = false, case_sensitive = false }
hints = ["It's the \"instruction counting\" trick — the quantity is right there in the name.", "The emulator tracks how many of these it executed."]
success = "Instructions — counting executed instructions is a clean, deterministic stand-in for timing, with none of the real-world noise."

[[steps]]
title = "Practice: count your way into Crackme #3"
text = '''
**Crackme #3** is built for this: its key check bails on the first wrong byte, so a correct byte makes it run further before failing — a textbook instruction-counting side channel.

Open it, point the **Side-channel solve** form at the check function, set the input length and a charset, and press Solve. Watch it recover the key one byte at a time, and read the per-position counts to see the signal.
'''
check = { kind = "open_crackme", name = "crackme03" }
hints = [
  "Open it from the lesson's practice programs (or the Academy's crackme list).",
  "Aim the solver at check_password; the recovered bytes are the key.",
]

[[steps]]
title = "Beyond the emulator"
text = '''
Instruction counting is the gateway; real side channels go much further:

- **Timing** — measure response time over a network; works on anything with a secret-dependent branch, just noisier.
- **Cache** — Flush+Reload and friends read secrets from which memory lines got cached.
- **Power / EM** — on hardware, differential power analysis (DPA) recovers keys from the chip's power draw.
- **Speculative execution** — Spectre-class bugs leak across security boundaries via the CPU's guesses.

The defence is **constant-time code**: compare *all* bytes regardless of mismatches (no early exit), and avoid branches or memory lookups whose path depends on a secret. A correct compare takes the same time for every input, so there's nothing to measure.

The big idea: a program's secret can escape through its **behaviour**, not just its output — and ORRESS turns that leak straight into the flag.
'''
