[[steps]]
title = "Open crackme #10"
goal = "Have the practice program open."
text = '''
In the first lesson you collected leads from the outside: the format, the strings, the
imports. Now you go inside, into the code. The problem: crackme #10 contains more than
400 functions, almost all from Rust's standard library and Microsoft's C runtime. Your own
code is three small functions among them. This lesson teaches you to go straight to them
instead of reading everything.

Open the program (again) with the button.
'''
instructions = ["Press the **Open crackme10** button below."]
check = { kind = "open_crackme", name = "crackme10" }

[[steps]]
title = "The entry point is not main"
goal = "Understand what runs between the entry point and your main."
text = '''
In Rust, your program starts in `fn main()`. The processor does not know that. It starts
at the **entry point** from the PE header (0x1400163A0 in crackme #10), and that is
start-up code you never wrote:

1. **Microsoft's C runtime** starts at the entry point. It sets up the heap, the
   command-line arguments and some security features, and then calls a function named
   `main`, as every C program expects.
2. That `main` is not yours. `rustc` writes it for you, and it looks roughly like this:

```rust
// generated by rustc, not by you:
extern "C" fn main(argc: i32, argv: *const *const u8) -> i32 {
    std::rt::lang_start(your_main, argc, argv)  // pass a pointer to YOUR main
}
```

3. **`std::rt::lang_start`**, in Rust's standard library, sets up panics, threads and
   `std::env::args()`, then calls `your_main()`, and finally turns its result into the
   program's exit code.

So between the entry point and your code there are three layers of start-up code. In a
stripped program none of them has a name. ORRESS recognises the rustc-generated function
by its shape, names it `rust_runtime_main`, and follows the pointer it passes to
`lang_start` to find the real `main`.

C, C++ and Go programs have similar layers. That is why "Go to main" is the first thing
you press in almost every program.
'''

[[steps]]
title = "Visit the entry point"
goal = "See with your own eyes that the entry point is start-up code."
text = '''
Have a look at the entry point anyway, so you know what start-up code looks like.

The **Disassembly** view has a **Go to** bar: press **Ctrl+G** while the disassembly has
focus and type an address (in hex, without `0x` if you like) or a name. ORRESS knows the
name `entry` for the entry point.

At the entry point you will find only four instructions: it makes room on the stack,
calls one function, gives the room back, and then **jumps** to another function. The
called function sets up a security value (the "stack cookie"); the jump goes to the C
runtime's main start-up routine. No message, no input, no check: nothing of your
program.

Which function does the entry point jump to at its end?
'''
instructions = [
    "Press **Ctrl+D** to open the **Disassembly** view of crackme10.exe.",
    "Click once inside the disassembly so it has keyboard focus.",
    "Press **Ctrl+G**, type `entry` in the **Go to** box and press **Enter**.",
    "Read the four instructions under `entry:`. The last one is a `jmp`.",
    "Type the name after `jmp` in the answer box (it starts with `sub_`).",
]
spotlight = "view.Disassembly"
check = { kind = "answer", answers = ["sub_140016224", "0x140016224", "140016224"] }
hints = [
    "The entry point starts at address 1400163a0.",
    "The last instruction is `jmp sub_1400162...`.",
    "Type `sub_140016224`.",
]
success = '''
`sub_140016224` is Microsoft's C runtime start-up. You could follow it through several
functions until it finally calls `rust_runtime_main`. Reversers almost never do: it is the
same in every program built with the same tools.
'''

[[steps]]
title = "How ORRESS finds main"
goal = "See the pointer to main in the generated function."
text = '''
Now look at the function in the middle: `rust_runtime_main`, the one rustc generated. It
is short. The interesting instruction is:

```text
lea      rax,[main]
```

`lea` means *load effective address*: it computes an address and puts it in a register,
without reading memory (Level 1). Here the address is the start of your `main`. The
function stores that pointer on the stack and calls the standard library's `lang_start`
(a `sub_` function), exactly like the Rust sketch in the previous step:
`std::rt::lang_start(your_main, argc, argv)`.

ORRESS saw that pattern and named the target `main`. That is how it can find your `main`
in a program without any names.

What does `rust_runtime_main` do with your `main`?
'''
instructions = [
    "Click inside the disassembly and press **Ctrl+G**.",
    "Type `rust_runtime_main` and press **Enter**.",
    "Find the line `lea rax,[main]` and look at what happens to `rax` and which function is called after it.",
]
check = { kind = "choice", options = [
    "It puts the address of main in a register, stores it, and passes it to another function that calls main later",
    "It calls main directly with a call instruction",
    "It copies the machine code of main to another place",
], correct = 0, explain = [
    "Right. main is called later, by lang_start in the standard library, through that pointer.",
    "There is no `call main` here. The call goes to a standard-library function, which gets main's address as an argument.",
    "lea only computes an address. Nothing is copied.",
] }
hints = [
    "`lea` loads an address, not the bytes at that address.",
    "Look at the `call` near the end of the function: it is not `call main`.",
]

[[steps]]
title = "Go to main"
goal = "Jump to the program's own main function."
text = '''
You do not have to walk this path every time. ORRESS gives you three ways to jump to
`main` directly:

- the key **Ctrl+Shift+M** (or **Go > Go to main** in the menu);
- the **Go to main** button at the top of the Info view;
- the **Go to main** button in the Functions view.

Use the first one now. You land on the first line of `main` in the Disassembly view. The
top line of the view shows where the cursor is, as a name plus an offset: `main` at the
start, `main+0x5` five bytes further.

Scroll down a little and recognise the program from its strings: the title, the prompt
`Licence code: `, then the input handling you know from Level 1 (the comparisons with
`0xa` and `0xd` remove the line ending), a `call`, `test al, al`, and the two answers.
'''
instructions = [
    "Press **Ctrl+Shift+M**.",
    "Check that the line `main:` is at the top of the Disassembly view, and that the toolbar says `main`.",
]
check = { kind = "cursor_in_main" }
hints = ["Hold Ctrl and Shift and press M. Or open the **Go** menu and choose **Go to main**."]
success = "You are in main: the start of the code you would have written yourself."

[[steps]]
title = "The Functions view"
goal = "See every function with its size and callers."
text = '''
The **Functions** view lists every function ORRESS found, one per row:

- **Name**: `main` and `rust_runtime_main` were found by ORRESS, names of imports come
  from the file, all other functions get a **generated name**: `sub_` plus the address.
  Names you give yourself are shown in bold.
- **Address**: where it starts.
- **Size**: how many bytes of code. Your own functions in a crackme are small; the
  standard library has some very big ones.
- **Blocks**: how many basic blocks (pieces of straight-line code) it has. More blocks
  means more `if`s and loops. You learn about blocks in lesson 5.
- **Callers**: how many places call it. A small function with dozens of callers is
  usually a helper, like a memory-copy function.

Above the table are a filter box (**Filter by name...**), a checkbox **Show import stubs**
(tiny functions that only jump to a library function; hidden by default) and a **Go to
main** button. Click a row to open that function in the disassembly.

How many bytes of code does `main` have?
'''
instructions = [
    "In the **Project** panel on the left, click **Functions**.",
    "Type `main` in the box **Filter by name...**.",
    "Read the **Size** column of the row named `main` (the row with the small blue `main` tag).",
    "Type the size in the answer box.",
]
spotlight = "tree.Functions"
check = { kind = "answer", answers = ["436"], number = true }
hints = [
    "The filter also shows `rust_runtime_main`. You want the row whose name is exactly `main`.",
    "The size is a decimal number between 400 and 450.",
    "It is 436.",
]
success = '''
436 bytes. Clear the filter and look at the rows just below `main`: `sub_1400012c0` (45
bytes) and `sub_1400012f0` (69 bytes) sit right next to it, because the compiler put your
functions together. The functions near `main` are often the program's own code.
'''

[[steps]]
title = "Follow a call"
goal = "Go into a function from a call instruction."
text = '''
In the disassembly, every function name and address in an instruction is a link. Click
it, and you jump there. Press **Enter** on a line to follow its address too.

Go back to `main` and find the decision you saw in Level 1:

```text
call     sub_1400012f0
test     al,al
je       loc_140001297      ; jumps to "Invalid licence code."
```

A function that returns a `bool` puts it in `al`. `test al, al` and `je` jump to the
failure message when it is `false`. So `sub_1400012f0` must be the licence check. Click
its name to go inside.

The function starts with a comparison of `rdx`. In the Windows calling convention a
`&[u8]` slice arrives as two arguments: the pointer in `rcx` and the **length** in `rdx`.
So the first thing the check does is test the length of your code.

Which length does it want?
'''
instructions = [
    "Press **Ctrl+Shift+M** to go to `main`.",
    "Scroll down to the line `call sub_1400012f0` (a few lines above the text `Licence accepted. Welcome!`).",
    "Click the name `sub_1400012f0` in that line. The disassembly jumps into the function.",
    "Read the first `cmp` instruction: `cmp rdx, ...`. Type the number in the answer box.",
]
spotlight = "view.Disassembly"
check = { kind = "answer", answers = ["6"], number = true }
hints = [
    "The call is just before `test al,al`.",
    "The first compare is `cmp rdx,6`.",
    "The answer is 6.",
]
success = '''
A valid code has 6 characters. You found that by following one call from `main`. Keep it
in mind: you will confirm it in the decompiler lesson.
'''

[[steps]]
title = "Go back"
goal = "Return to where you were, like the back button of a browser."
text = '''
Following calls takes you deeper and deeper. To find your way back, ORRESS keeps a
**navigation history** of every jump you make, like a web browser:

- **Alt+Left** (or **Go > Go Back**) returns to where you were before the last jump.
- **Alt+Right** (or **Go > Go Forward**) undoes a Go Back.
- Inside the disassembly, **Esc** or **Backspace** also go back.

A good habit: jump in, read, jump back. You never lose your place, and you can explore a
side path without fear.

Go back from `sub_1400012f0` to the `call` in `main`.
'''
instructions = [
    "Make sure you are inside `sub_1400012f0` (follow the call again if you moved away).",
    "Press **Alt+Left** (or open the **Go** menu and click **Go Back**).",
    "Check that the cursor is back on the line `call sub_1400012f0` in `main`.",
]
check = { kind = "action", id = "nav::Back" }
hints = ["Hold Alt and press the left arrow key. The menu **Go > Go Back** does the same."]
success = "Back in main, exactly where you left. Alt+Right would take you into the check again."

[[steps]]
title = "Cross-references: who calls this?"
goal = "Use cross-references to find who calls a function."
text = '''
Following calls goes *down*: from `main` into the functions it calls. Often you need to go
*up*: "who calls this function?", "who uses this string?". The answer is the list of
**cross-references** (xrefs): every instruction that calls, jumps to or reads an address.

In the disassembly, put the cursor on a line and press **X**. If the line contains an
address (a call, a string), you get the references to that address; on a function's first
line (`sub_...:`) you get the references to the function. The **Cross-references** panel
at the bottom of the window then lists them:

- **From**: the address of the instruction that refers to it (click it to go there);
- **In**: which function that instruction is in, plus an offset;
- **Kind**: `call`, `jump` or `data` (reading an address, as for a string);
- **Instruction**: the instruction itself.

The Functions view's **Callers** column counts the same references.

Find out who calls `sub_1400012c0`, the small function right after `main`.
'''
instructions = [
    "Press **Ctrl+G** in the disassembly, type `1400012c0` and press **Enter**. The cursor is now at the start of `sub_1400012c0`.",
    "Press **X**. The **Cross-references** panel at the bottom shows *References to sub_1400012c0*.",
    "Read the **In** column. Type the name of that function (without the `+0x...` part) in the answer box.",
]
spotlight = "dock.bottom"
check = { kind = "answer", answers = ["sub_1400012f0", "0x1400012f0", "1400012f0", "is_valid"] }
hints = [
    "There is only one reference, of kind `call`.",
    "The **In** column says `sub_1400012f0+0x2c`.",
    "Type `sub_1400012f0`.",
]
success = '''
`sub_1400012c0` is called only by `sub_1400012f0`, the licence check. So it is a helper of
the check: whatever it computes matters for a valid code. You now know how your three
functions fit together: `main` calls `sub_1400012f0`, which calls `sub_1400012c0`.
'''

[[steps]]
title = "From a message to the code"
goal = "Jump from a string straight to the instruction that uses it."
text = '''
Strings have cross-references too, and they are the fastest way into any program. Each
instruction that loads a string is a reference to it. In the **Strings** view, the
**Refs** column shows how many there are, as a link like `1 »`. Click it, and the
disassembly jumps to the first instruction that uses the string.

Do it for the success message `Licence accepted. Welcome!`. You land on a `lea` that loads
the message, in `main`. Look one line up: it is the `je` that jumps *away* to the failure
message when the check returned `false`. Success and failure are decided right there.

Every line in the disassembly starts with its address, written with 16 hex digits. What is the address of the
instruction the link took you to?
'''
instructions = [
    "In the **Project** panel on the left, click **Strings**.",
    "Type `accepted` in the filter box.",
    "In the row `Licence accepted. Welcome!`, click the link `1 »` in the **Refs** column. The disassembly opens.",
    "Read the address at the start of the highlighted line. It has 16 hex digits and starts with `0000000140`; the leading zeros do not matter. Type it in the answer box, in hex.",
]
spotlight = "tree.Strings"
check = { kind = "answer", answers = ["0x14000122c"], number = true }
hints = [
    "The highlighted line is `lea rcx,[0x140018429]` with the comment `; \"Licence accepted. Welcome!\"`.",
    "The toolbar says `main+0x12c`. main starts at 0x140001100.",
    "0x140001100 + 0x12c = 0x14000122c.",
]
success = '''
0x14000122c, inside `main`. From a message to the deciding jump in two clicks. This works
in every program that prints something: find a telling string, follow its references,
read the code around them. It is the most important navigation trick in reverse
engineering.
'''

[[steps]]
title = "Your navigation toolkit"
goal = "Remember the keys and views for moving through a program."
text = '''
You can now move through a program of hundreds of functions without getting lost:

| You want to... | Use |
|---|---|
| start where the program's own code starts | **Ctrl+Shift+M** (Go to main) |
| see all functions, their size and callers | **Functions** view (Ctrl+Shift+F) |
| open the disassembly | **Ctrl+D** |
| jump to an address or a name | **Ctrl+G** in the disassembly |
| go into a called function | click its name, or **Enter** on the line |
| go back / forward | **Alt+Left** / **Alt+Right** (Esc in the disassembly) |
| find who calls or uses something | **X** on the line, the **Cross-references** panel |
| jump from a message to its code | **Strings** view, the **Refs** link |

And the map of crackme #10 so far:

```text
entry -> C runtime -> rust_runtime_main -> lang_start -> main
main -> sub_1400012f0 (the check: length must be 6) -> sub_1400012c0 (a helper)
```

Names like `sub_1400012f0` are hard to remember. In the next lesson you give these
functions real names, and you write comments, so the map is in the program itself.
'''
success = "Lesson complete. You can find your way in any program."
