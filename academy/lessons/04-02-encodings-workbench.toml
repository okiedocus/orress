id = "l4-encodings"
level = 4
order = 24
title = "Encodings and the Workbench"
summary = "Hex, base64, ROT13 and XOR: how they work, how to spot them, and how to peel them off in ORRESS's Workbench."
goals = [
    "explain how hex and base64 turn bytes into text",
    "recognise base64, ROT13 and XOR-scrambled data",
    "decode data with a Workbench recipe",
    "recover an XOR key from a known start such as flag{",
    "let Magic find a chain of decodings for you",
]
badge = "Decoder Ring"

[[steps]]
title = "Why programs disguise text"
goal = "Understand why a flag is rarely stored as plain text."
text = '''
In Level 1 you found passwords with the **Strings** view: the password was stored as plain text, so it showed up in the list. Challenge authors know that too. So they disguise the flag before they put it in the program, and the program undoes the disguise at run time (or disguises your input the same way and compares).

The cheapest disguise is an **encoding**: the same bytes written in a different form. Here is the idea in Rust:

```rust
let secret = "flag{hi}";
let disguised = to_base64(secret);   // "ZmxhZ3toaX0="
// The program stores only "ZmxhZ3toaX0=".
// At run time it calls from_base64 and compares with your input.
```

In the Strings view you would now see `ZmxhZ3toaX0=`, which does not look like a flag at all. But anyone who recognises base64 can decode it in a second. Encodings are not protection, they only stop a quick glance.

In this lesson you learn the four disguises you will meet most often in CTFs:

1. **hex**: every byte written as two hex digits,
2. **base64**: bytes written with 64 safe characters,
3. **ROT13**: every letter shifted 13 places in the alphabet,
4. **XOR** with a short key.

For each one you learn how it works, how to recognise it, and how to undo it in ORRESS's **Workbench**, a tool that chains decoding steps together.
'''
success = "Let's start with the one you already know from Level 0: hex."

[[steps]]
title = "Hex as text"
goal = "Decode hex digits back into characters."
text = '''
You know hexadecimal from Level 0: one byte is two hex digits, from `00` to `ff`. When a program writes bytes as hex **text**, each byte becomes two characters. The byte `0x66` becomes the two characters `6` and `6`.

So the 4-byte text `flag` becomes the 8-character text `666c6167`:

| character | `f` | `l` | `a` | `g` |
|---|---|---|---|---|
| ASCII code (hex) | `66` | `6c` | `61` | `67` |

**How to recognise hex text:** it uses only the digits `0`-`9` and the letters `a`-`f` (or `A`-`F`), its length is even, and it is often split into pairs by spaces. A long string like `0c0b5df889a72f01` is almost certainly hex.

**How to decode it:** split it into pairs, turn each pair into a byte, and read the bytes as ASCII. Try it on this one:

```text
72 33 76
```
'''
instructions = [
    "Look up each pair in the ASCII table below: `72`, then `33`, then `76`.",
    "Type the three characters into the answer box and press **Check**.",
]
widget = "ascii_table"
check = { kind = "answer", answers = ["r3v"], case_sensitive = true }
hints = [
    "0x30 to 0x39 are the digits 0 to 9, so 0x33 is a digit.",
    "0x72 is r and 0x76 is v.",
    "The answer is r3v.",
]
success = "`r3v`. Hex text doubles the size of the data and uses only 16 different characters. Those two facts give it away."

[[steps]]
title = "How base64 works"
goal = "Understand why base64 text looks the way it does."
text = '''
Hex is wasteful: two characters per byte. **Base64** packs data more tightly. It uses 64 different characters, the **alphabet**:

```text
A-Z  (values 0-25)   a-z  (26-51)   0-9  (52-61)   +  (62)   /  (63)
```

64 is 2 to the power 6, so each character carries exactly **6 bits**. Base64 takes the input **3 bytes at a time** (3 x 8 = 24 bits) and cuts those 24 bits into **4 pieces of 6 bits**. Each piece is a number from 0 to 63, which picks one character.

Worked example: the text `Man`.

1. The bytes: `M` = `0x4d`, `a` = `0x61`, `n` = `0x6e`.
2. In bits: `01001101 01100001 01101110`.
3. Cut into four 6-bit groups: `010011 010110 000101 101110`.
4. As numbers: 19, 22, 5, 46.
5. Look them up: 19 = `T`, 22 = `W`, 5 = `F`, 46 = `u`.

So `Man` becomes `TWFu`. Every 3 bytes become 4 characters.

When the input length is not a multiple of 3, the last group is padded and the output ends with one or two `=` signs. That is why base64 text so often ends in `=` or `==`.

**How to recognise base64:** only the characters `A-Z a-z 0-9 + /`, a length that is a multiple of 4, and maybe `=` at the end. Text starting with `Zmxh` is a gift: it is base64 for `fla`, the start of `flag{`.
'''
deep_dive = '''
In Rust you would write the core of a base64 encoder like this:

```rust
const ALPHABET: &[u8; 64] =
    b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";

fn encode3(b: [u8; 3]) -> [u8; 4] {
    let n = (b[0] as u32) << 16 | (b[1] as u32) << 8 | b[2] as u32;
    [
        ALPHABET[(n >> 18 & 63) as usize],
        ALPHABET[(n >> 12 & 63) as usize],
        ALPHABET[(n >> 6 & 63) as usize],
        ALPHABET[(n & 63) as usize],
    ]
}
```

When you see a 64-byte table like `ALPHABET` in a program's data, the program contains its own base64 code. Some challenges use a *shuffled* alphabet so that normal decoders fail. The Workbench's **From base64** step has an `alphabet` field for exactly that case: copy the program's table into it.
'''
success = "Three bytes in, four characters out. Keep that ratio in mind for the next question."

[[steps]]
title = "Base64 by the numbers"
goal = "Use the 3-to-4 rule."
text = '''
Base64 turns every group of **3 bytes** into **4 characters**. When the input fills whole groups exactly, there is no `=` padding at the end.

A program stores a 24-byte flag as base64 text. 24 bytes is exactly 8 groups of 3 bytes.

How many characters long is the base64 text?
'''
instructions = [
    "Count the groups: 24 bytes divided by 3 bytes per group.",
    "Multiply the number of groups by 4 characters per group.",
    "Type the result and press **Check**.",
]
check = { kind = "answer", answers = ["32"], number = true }
hints = [
    "24 / 3 = 8 groups.",
    "8 groups x 4 characters = ?",
]
success = "32 characters. You can also go the other way: base64 text of length L holds about L x 3 / 4 bytes. That is how you estimate what is hidden inside before you decode it."

[[steps]]
title = "Open the Workbench"
goal = "Find the Workbench and learn its three columns."
text = '''
ORRESS's **Workbench** decodes, decrypts and decompresses data. It works with a **recipe**: a list of steps, where each step works on the output of the step before it. For example, "first From base64, then ROT13".

The Workbench has three columns:

1. **Operations** (left): every step you can add, grouped into categories such as *Encoding*, *Text*, *Bitwise*, *Crypto* and *Hashes*. A search box at the top filters the list. Click an operation to add it to the end of the recipe. Hover over it to read what it does.
2. **Recipe** (middle): the steps, top to bottom. Each step has a tick box (untick it to skip the step), `^` and `v` to move it, `x` to remove it, and fields for its settings, such as a key. Below the steps, **As text** shows the same recipe as one line, for example `from_base64 | rot13`, and the **Clear** button removes all steps.
3. **Input and Output** (right): type or paste the data into the **Input** box. The **text / hex** switch says whether you type characters or hex bytes. The **Output** box shows the result after all steps, and says **This looks like a flag!** when it finds one. The **Magic** button at the bottom tries to find a recipe for you.

Open it now.
'''
instructions = [
    "Click the **Tools** menu at the top of the window.",
    "Click **Workbench**. (The shortcut is `Ctrl+Shift+W`; you can also type `Workbench` in the command palette, `Ctrl+Shift+P`.)",
]
check = { kind = "action", id = "workbench::Open" }
hints = [
    "The Workbench is under the Tools menu, not under View.",
    "Tools, then Workbench. Or press Ctrl+Shift+W.",
]
success = "The Workbench opened as a tab in the middle. You can drag the tab next to this lesson so you see both."

