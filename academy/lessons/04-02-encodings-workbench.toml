[[steps]]
title = "ROT13: shifting letters"
goal = "Undo a letter-shift cipher."
text = '''
**ROT13** ("rotate by 13") replaces every letter with the letter 13 places further in the alphabet, wrapping around from `z` to `a`. Digits, punctuation and braces stay as they are.

```text
a b c d e f g h i j k l m      (letters 0-12)
n o p q r s t u v w x y z      (letters 13-25)
```

So `a` becomes `n`, `f` becomes `s`, and `n` becomes `a` again. The alphabet has 26 letters, so shifting by 13 twice brings every letter back: **ROT13 undoes itself**. In Rust:

```rust
fn rot13(c: char) -> char {
    match c {
        'a'..='z' => (((c as u8 - b'a' + 13) % 26) + b'a') as char,
        'A'..='Z' => (((c as u8 - b'A' + 13) % 26) + b'A') as char,
        _ => c,
    }
}
```

**How to recognise ROT13:** the text keeps the shape of the original (same length, braces and underscores in the same places), but the words are nonsense. `flag{` becomes `synt{`. When you see `synt{`, think ROT13.

ROT13 is a special case of the **Caesar cipher**, which shifts by any amount. The Workbench has both: **ROT13** and **Caesar shift** (with a `shift` setting), in the *Text* category.

Decode this one:

```text
synt{ebg13_vf_whfg_n_fuvsg}
```
'''
instructions = [
    "Copy the string above with the copy icon of its grey box.",
    "In the Workbench, click **Clear** in the middle column.",
    "In the left column, search for `rot` and click **ROT13**.",
    "Click into the **Input** box, press `Ctrl+A`, then `Ctrl+V`.",
    "Type the flag from the **Output** box into the answer box and press **Check**.",
]
check = { kind = "secret", sha256 = "cb4a012c5138f0733609e8e69811c04a6401dd04264b517c365cf41140cbfbca" }
hints = [
    "The output should start with flag{.",
    "If the output still says synt{, the recipe is empty or the step is unticked.",
    "The flag says that ROT13 is just a shift.",
]
success = "ROT13 hides text from a human reader for about two seconds. Like base64 it needs no key: knowing the method is enough."

[[steps]]
title = "XOR and the known start"
goal = "Recover an XOR key from the text you know the flag starts with."
text = '''
You met XOR in Level 2: `a ^ k` flips the bits of `a` where `k` has a 1, and XOR with the same `k` again gives `a` back. Programs often XOR a flag with a short **repeating key**: byte 0 with key byte 0, byte 1 with key byte 1, and so on, starting over when the key runs out.

```rust
fn xor(data: &[u8], key: &[u8]) -> Vec<u8> {
    data.iter().enumerate().map(|(i, b)| b ^ key[i % key.len()]).collect()
}
```

If you know the key, decoding is the same function again. But what if you do not know the key?

Here is the trick. You know the flag starts with `flag{`. XOR has a third useful property: `plain ^ key == cipher` means `cipher ^ plain == key`. So XOR the first scrambled bytes with `f`, `l`, `a`, `g`, `{` and the key falls out.

Worked example with the first byte below: `0x25 ^ 0x66` (the code of `f`) = `0x43`, which is the character `C`. That is the first key byte.

This kind of attack is called a **known-plaintext attack**: knowing part of the original text reveals the key. The Workbench automates it with the operation **XOR key from known text**. It tries every key length up to the length of the known text, finds the key, decrypts, and prints the key on the first output line.

Here is a flag XORed with a short key, written as hex:

```text
25 38 27 24 2f 2d 2d 64 31 2d 0b 36 2f 60 77 2d 20 75 3b 20 19 34 65 28 30 29
```

What is the key?
'''
instructions = [
    "Copy the hex bytes above with the copy icon of their grey box.",
    "In the Workbench, click **Clear**, then add **From hex** (search `hex`) and then **XOR key from known text** (search `known`). The order matters: first From hex, then XOR.",
    "Check that the `known` field of the XOR step says `flag{` (that is the default).",
    "Paste the hex into the **Input** box (with **text** selected, `Ctrl+A`, `Ctrl+V`).",
    "The first output line says `key: 0x... (\"...\")`. Type the key text shown between the quotes and press **Check**.",
]
check = { kind = "answer", answers = ["CTF"], case_sensitive = true }
hints = [
    "Read only the first line of the output: key: 0x435446 (...).",
    "0x43 0x54 0x46 are three ASCII characters.",
    "The key is CTF, in capitals.",
]
success = "The key is `CTF` and the second output line is the flag. One known word was enough to break the key. This is why XOR with a short key is not real encryption: real ciphers are built so that knowing part of the text does not reveal the key."

[[steps]]
title = "Read the decrypted flag"
goal = "Confirm the XOR decryption."
text = '''
Look at the Output box again. Below the `key:` line is the decrypted text.

When you know the key, you can also decrypt with the plain **XOR** operation and its `key` field. The `key` field accepts three forms:

- text, such as `CTF`,
- hex with `0x` in front, such as `0x435446`,
- hex bytes with `hex:` in front, such as `hex:43 54 46`.

All three mean the same three bytes. The plain XOR step is what you use when the program shows you the key directly, for example in the decompiler.
'''
instructions = [
    "Read the second line of the Workbench **Output** box.",
    "Type that flag into the answer box and press **Check**.",
]
check = { kind = "secret", sha256 = "f17e01a7fab0f64c62132b89e683d3753237ba4415ee0947f5f39948cbd5d00b" }
hints = [
    "It is the line below key: 0x435446 (\"CTF\").",
    "It starts with flag{kn0wn.",
]
success = "Known plaintext wins. Remember the trick for every XOR challenge: what do you know about the start of the hidden text?"

[[steps]]
title = "Chains and Magic"
goal = "Let the Workbench find a recipe for you."
text = '''
Challenge authors like to stack disguises: ROT13 first, then base64 on top, or XOR, then hex. You undo them in **reverse order**: the last disguise added is the first one you remove. In Rust terms:

```rust
let stored = to_base64(rot13(flag));   // ROT13 first, base64 on top
let flag   = rot13(from_base64(stored)); // undo base64 first, then ROT13
```

You could try combinations by hand, but the Workbench has a button for it: **Magic**. Magic tries the common decodings (hex, base64, base32, URL, zlib, gzip, XOR with one byte, ROT13, UTF-16 and more) in chains of up to 3 steps. It scores each result by how readable it is and lists the best ones, each with its recipe, a preview, and the reason it was chosen ("looks like a flag!", "readable text"). Click **Use** next to a result to load its recipe.

Magic does not know the program. It only looks at the data, so it is a starting point: always check that the result makes sense.

Try it on this stacked disguise:

```text
c3ludHt6NHQxcF9zMWFxZl9ndTNfcHU0MWF9
```
'''
instructions = [
    "Copy the string above with the copy icon of its grey box.",
    "In the Workbench, click **Clear** in the middle column.",
    "Paste the string into the **Input** box (`Ctrl+A`, `Ctrl+V`).",
    "Click **Magic** at the bottom of the right column.",
    "Click **Use** next to the first suggestion. Its recipe appears in the middle column.",
    "Type the flag from the **Output** box into the answer box and press **Check**.",
]
check = { kind = "secret", sha256 = "e1ecd9386372f53dc2c7602f35d6256d08a68830788a9f00789ddc88e42c4a55" }
hints = [
    "The first suggestion should be marked (looks like a flag!).",
    "Its recipe is from_base64 | rot13: base64 was added last, so it is removed first.",
    "If Magic shows nothing, check that the input box contains only the string.",
]
success = "Magic found `from_base64 | rot13`. The string started with `c3lu`, which is base64 for `syn`: base64 on the outside, ROT13 (`synt{`) on the inside."

[[steps]]
title = "Recognising disguises: a summary"
goal = "Have a checklist for strange-looking data."
text = '''
When a challenge gives you strange text, or the Strings view shows something odd, go through this list:

| You see | It is probably | Undo it with |
|---|---|---|
| only `0-9 a-f`, even length, maybe pairs with spaces | hex | **From hex** |
| `A-Z a-z 0-9 + /`, length a multiple of 4, maybe `=` at the end; starts with `Zmxh` | base64 | **From base64** |
| uppercase and `2-7` only, `=` padding | base32 | **From base32** |
| `%41%42` | URL encoding | **URL decode** |
| `synt{`, words of the right length but nonsense | ROT13 | **ROT13** |
| random-looking bytes, and you know how the text starts | XOR with a short key | **XOR key from known text** |
| random-looking bytes, one-byte key suspected | XOR with one byte | **XOR brute force** |
| bytes starting `78 9c` or `1f 8b` | zlib or gzip compression | **Zlib decompress**, **Gzip decompress** |
| none of the above | maybe real encryption | the next lesson |

You can also run every recipe outside the app. The **Copy as command** button under the recipe copies a command for `orress-cli`, ORRESS's command-line tool, for example `orress-cli recipe "from_base64 | rot13" FILE`, and `orress-cli magic FILE` runs Magic on a file. That is handy when you have many files to decode.

And if Magic finds nothing readable, the data may be truly encrypted. Encrypted data looks random, and its **entropy** (a measure of randomness from 0 to 8, which the Workbench shows under the output) is close to 8. That is the topic of the next lesson.
'''
success = "You can now peel off every common encoding. Next: real ciphers, and how to recognise them inside a program."
