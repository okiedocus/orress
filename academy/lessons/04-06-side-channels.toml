id = "l4-side-channels"
level = 4
order = 28
title = "Side channels"
summary = "A check can leak its secret through how much work it does. Recover crackme03's password one character at a time by counting instructions."
goals = [
    "explain what a side channel is",
    "explain why an early-exit comparison leaks how much of the input is right",
    "recover a password byte by byte with the Emulator's Side-channel solve",
    "read the per-position counts and spot where the signal is missing",
    "know the defence: constant-time code",
]
badge = "Leak Hunter"

[[steps]]
title = "Secrets leak sideways"
goal = "Understand the idea of a side channel."
text = '''
A check function gives you one bit of information: right or wrong. "Wrong key. Try again!" is the same for every wrong key. Or is it?

The *output* is the same, but the *work* is not. A program that decides something about a secret often does a different amount of work depending on that secret: it runs longer or shorter, it uses the processor's memory cache differently, it even draws a slightly different amount of electrical power. Anything you can measure from the outside that depends on the secret is a **side channel**: information that leaks *beside* the official output.

Real-world examples:

- **Timing attacks**: a server that checks a password takes a few nanoseconds longer when the first character is right. Measured over many tries, that tiny difference reveals the password.
- **Power analysis**: the power drawn by a smart card while it encrypts reveals the bits of its key.
- **Cache attacks**: which memory a program touched is visible to another program on the same processor.

In this lesson you use the cleanest side channel of all: **instruction counting**. You run the check in ORRESS's emulator and count how many instructions it executes. No noise, no statistics, just one exact number per try.
'''
success = "Next: why a perfectly ordinary comparison loop leaks."

[[steps]]
title = "The early exit"
goal = "See exactly where crackme03's check leaks."
text = '''
Here is crackme03's check function, from its source. You solved this crackme in Level 2 by undoing the XOR:

```rust
fn check_password(s: &[u8]) -> bool {
    if s.len() != CIPHER.len() {
        return false;
    }
    let mut i = 0;
    while i < CIPHER.len() {
        if s[i] ^ KEY[i % 4] != CIPHER[i] {
            return false;   // stop at the FIRST wrong character
        }
        i += 1;
    }
    true
}
```

Look at the `return false` inside the loop. It is an **early exit**: the loop stops at the first character that does not match. That is natural and efficient, and it is exactly the leak:

- If the first character is wrong, the loop runs once and stops.
- If the first character is right but the second is wrong, the loop runs twice.
- If the first three are right, it runs four times.

So the **amount of work tells you how many characters at the start are right**. The function was supposed to answer only "yes or no", but by the way it works it answers "how many correct characters at the start", which is much more.

A check that leaks like this is called an **oracle**: something you can ask questions that answers more than it should.
'''
success = "Early exit = leak. Now: how do you use it?"

[[steps]]
title = "One character at a time"
goal = "Turn the leak into a strategy."
text = '''
You can measure how far the loop gets, but you still do not know any character of the password. How do you turn "how far did it get" into the full password?
'''
check = { kind = "choice", options = [
    "Try every possible first character; the one that makes the check run longest is right. Keep it, then do the same for the second character, and so on",
    "Try every possible full password and keep the one that runs longest",
    "Run the check once with an empty input and read the password from the count",
    "Measure the time of the 'Correct!' message",
], correct = 0, explain = [
    "Right. At position 0, only the correct character lets the loop continue to position 1, so it runs longest. Lock it in and move right. Each position is solved on its own.",
    "That is brute force again: 95^8 tries. The point of the side channel is that you never need to try full passwords.",
    "One measurement gives one number. The leak only says how many leading characters are right, so you need many tries, one position at a time.",
    "You only see 'Correct!' after you already have the password.",
] }
hints = [
    "The leak tells you whether the characters *at the start* are right.",
    "Fix the characters you already know and vary only the next one.",
]
success = "Position by position. That changes the amount of work dramatically, as the next question shows."

[[steps]]
title = "Counting the work"
goal = "Compare the side channel with brute force."
text = '''
Brute force on an 8-character password over 95 printable characters needs up to 95^8, about 6.6 x 10^15 tries.

With the side channel you solve one position at a time. For each position you try all 95 characters once and keep the best. Then the next position, with the same 95 tries.

How many tries does the side channel need for all 8 positions, at most?
'''
instructions = [
    "Multiply the number of positions by the number of candidates per position.",
    "Type the result and press **Check**.",
]
check = { kind = "answer", answers = ["760"], number = true }
hints = [
    "8 positions x 95 candidates.",
    "8 x 95 = ?",
]
success = "760 tries instead of 6.6 x 10^15. The work grows by *adding* 95 per character instead of *multiplying* by 95. That is why an early exit is a real security bug, not a curiosity."

[[steps]]
title = "Measuring without noise"
goal = "Understand why ORRESS counts instructions instead of time."
text = '''
On a real computer you would measure **time**. But time is noisy: other programs run, the processor changes its speed, the operating system interrupts. A difference of a few nanoseconds disappears in that noise, so a real timing attack repeats every measurement thousands of times and averages.

In an **emulator** (Level 3) you do not need any of that. The emulator executes the function one instruction at a time and can simply count them. One more loop iteration means a few more instructions, every time, exactly. That count is a perfect, noise-free stand-in for time.

ORRESS's **Side-channel solve**, in the Emulator tab, does the whole attack for you:

1. It writes a candidate input into memory (unknown positions are filled with zero bytes at first).
2. For position 0, it tries every character of the chosen **Charset** (printable, alphanumeric, or digits), calls the function, and counts the executed instructions.
3. It keeps the character with the highest count, and moves to position 1.
4. At the end it shows the **Recovered input** and a table, **per-position instruction counts**: for every position the chosen byte, its count, and the **runner-up** (the second-highest count).

The runner-up column is your quality check. A clear signal looks like `count 24, runner-up 18`: one character stood out. Equal numbers mean no character made a difference at that position.
'''
success = "Now do it on crackme03."

[[steps]]
