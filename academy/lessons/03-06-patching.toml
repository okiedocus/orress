id = "l3-patching"
level = 3
order = 6
title = "Patching"
summary = "Change the program's bytes, not just a register. Remove the branch that rejects a wrong password, and save a patched copy that behaves that way every time."
badge = "Byte Surgeon"
goals = [
    "name the three common one-instruction patches",
    "choose the right patch for a given branch",
    "apply a patch from the Disassembly view",
    "know that the original file is never changed",
    "save a patched copy to run it",
]

[[steps]]
title = "Making the change permanent"
goal = "See how patching differs from changing a register."
text = '''
Last lesson you forced crackme #2 to accept a wrong password by setting a register. But that change lived for one run only. Start the program again and the check is back.

**Patching** makes the change permanent. Instead of editing a register each run, you edit the program's **instructions** once. A patched program behaves the new way every time, on its own, with no debugger attached.

The edits are tiny. You are not rewriting the program; you change one jump, or delete one instruction. The skill is choosing *which* instruction and *which* change.

Patching has two common uses:

- **Beat a check for good.** Make the password check always pass, or delete an anti-debug trap, and save a copy that just works.
- **Test an idea fast.** "If I remove this call, does the crash go away?" Change one instruction, run it, and see. It is often quicker than reasoning it out.

In this lesson you remove the branch that sends a wrong password to "Wrong", so crackme #2 prints "Correct!" for anything, and you save that as a patched `.exe`.
'''

[[steps]]
title = "Open crackme #2"
goal = "Open the program to patch."
text = '''
Open crackme #2 once more. If you set a breakpoint on it earlier, that is fine; it does not affect patching.
'''
instructions = [
    "Click the button **Open crackme02** below (or bring its tab to the front).",
