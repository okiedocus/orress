id = "l0-bytes-and-text"
level = 0
order = 3
title = "Bytes and text"
summary = "ASCII, UTF-8, UTF-16, and how Rust stores strings."

[[steps]]
title = "Characters are numbers"
text = '''
Text is stored as numbers too. **ASCII** gives every English letter, digit and symbol a code below 128: `'A'` is 0x41, `'a'` is 0x61, `'0'` is 0x30, space is 0x20.

```rust
assert_eq!(b'A', 0x41);
assert_eq!('a' as u32, 0x61);
```

Which character has the code `0x41`?
'''
widget = "ascii_table"
check = { kind = "answer", answers = ["A"], case_sensitive = true }
hints = ["Look it up in the table: row 4, column 1."]

[[steps]]
title = "From character to code"
text = '''
When you reverse a password check, you will often see `cmp al, 0x52` and need to know which character 0x52 is. Practice the other direction: what is the code of a lowercase `'a'`? (Hex or decimal both work.)
'''
widget = "ascii_table"
check = { kind = "answer", answers = ["0x61"], number = true }
hints = ["Lowercase letters start at 0x61."]

[[steps]]
title = "How Rust stores strings"
text = '''
A Rust `&str` is two things: a **pointer** to the bytes and a **length**. The bytes are UTF-8 and there is **no zero byte** at the end:

```rust
let s: &str = "hi";
assert_eq!(s.as_bytes(), &[0x68, 0x69]);
assert_eq!(s.len(), 2);
```

C does it differently: a C string has no length; it ends with a zero byte (`NUL`, 0x00). You will meet both, because Windows and C libraries use C strings.

One consequence for reversing Rust programs: string literals are stored **back to back**, so ORRESS's Strings view may show `"Password: Wrong password"` as one long string. The length passed in a register tells where each one really ends.

How does a Rust program know where a `&str` ends?
'''
check = { kind = "choice", options = [
    "It looks for a zero byte after the text",
    "It keeps the length next to the pointer",
    "It searches for a newline",
    "Strings always have 16 characters",
], correct = 1 }

[[steps]]
title = "Wide strings on Windows"
text = '''
Windows uses **UTF-16** for its "wide" strings: two bytes per character, little-endian. For English text that means every letter is followed by a zero byte:

```rust
let wide: Vec<u16> = "A".encode_utf16().collect();
assert_eq!(wide, [0x0041]);   // stored as the bytes 41 00
```

In a hex view, `H.e.l.l.o.` is UTF-16 text. ORRESS's Strings view finds both kinds and marks them ASCII or UTF-16.

How is `'A'` stored in UTF-16 little-endian?
'''
check = { kind = "choice", options = ["41", "00 41", "41 00", "65"], correct = 2 }
hints = ["Little-endian: the low byte comes first."]
