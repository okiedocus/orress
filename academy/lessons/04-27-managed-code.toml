id = "l4-managed-code"
level = 4
order = 27
title = "Managed code"
summary = "When the binary isn't machine code: .NET, Java, Python and WebAssembly ship bytecode that keeps names and structure — and reverses far more easily."
badge = "Bytecode Reader"

[[steps]]
title = "Not every binary is machine code"
text = '''
So far you've reversed **native** code — x86 or ARM instructions the CPU runs directly. But a huge share of software ships as **bytecode** for a **runtime virtual machine** instead:

- **.NET** assemblies run on the **CLR**.
- **Java** `.class`/`.jar` files run on the **JVM**.
- **Python** `.pyc` files run on the **CPython** VM.
- **WebAssembly** `.wasm` modules run in a **Wasm runtime** (browsers, and standalone).

The runtime reads the bytecode and interprets or JIT-compiles it. This is **managed code**, and it plays by different rules than a native binary — usually to your advantage.
'''

[[steps]]
title = "Why managed code is friendlier"
text = '''
A native compiler throws away almost everything by the time it emits machine code: variable names, types, often function names too. A stripped `.exe` is a desert.

Managed runtimes can't do that. To load, link, resolve and type-check code at runtime, the VM **needs rich metadata** — and that metadata travels **inside the file**:

- **Type, method and field names** — usually the originals.
- **String constants**, laid out plainly.
- **Signatures and structure** — what calls what, with what argument types.

So from a managed binary you often recover names, structure and strings for free, and a decompiler can rebuild something very close to the original source. The "hard part" of native RE — recovering meaning from anonymous code — is largely handed to you.
'''

[[steps]]
title = "What makes it easier"
text = '''
Why is a plain (un-obfuscated) .NET or Java program so much easier to reverse than a stripped native executable?
'''
check = { kind = "choice", options = [
