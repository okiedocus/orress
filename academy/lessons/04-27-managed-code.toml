[[steps]]
title = "A view for each runtime"
text = '''
ORRESS loads each managed format with a dedicated, pure-Rust view:

- **.NET view** — the CLI metadata: types and methods, module/assembly names, the table overview and the user-string heap.
- **Java Class view** — the constant pool, fields (with recovered constant values), methods, and a JVM bytecode disassembly.
- **Python Bytecode view** — the `.pyc` code-object tree (module, functions, comprehensions) with constants, names, and a CPython disassembly.
- **WebAssembly view** — imports, exports, functions with signatures, memories and globals, plus a WAT disassembly.

Let's look at one. Open the **.NET view** (the View menu, or the command palette — the other three open the same way for their file types).
'''
check = { kind = "action", id = "view::DotNet" }
spotlight = "view.DotNet"
hints = ["Ctrl+Shift+P, then type \".NET\" — or the View menu."]

[[steps]]
title = "Reading the bytecode"
text = '''
When metadata isn't enough and you drop to the bytecode itself, these runtimes share a family resemblance. The JVM, the CLR's CIL, CPython and WebAssembly all evaluate expressions by **pushing operands onto an operand stack and popping them** — just like the custom VMs you met at Advanced level.

So most of these runtimes are which kind of virtual machine — **stack**-based or register-based? (One word.)
'''
check = { kind = "answer", answers = ["stack"], number = false, case_sensitive = false }
hints = ["Operands are pushed and popped from a central structure.", "It's the same kind of VM as the stack machine in the custom-VM lesson."]
success = "Stack-based — values are pushed and popped on an operand stack, so `push a; push b; add` is the universal shape. Once you can read one, the others feel familiar."

[[steps]]
title = "Attacking managed code"
text = '''
A practical workflow:

1. **Recognise the format.** A .NET assembly is a PE carrying a **CLI metadata header**; a Java class starts with the magic `CA FE BA BE`; a `.wasm` starts with `00 61 73 6D` ("\0asm"); a `.pyc` starts with a version-specific magic number. ORRESS detects these on load.
2. **Open the matching view** and read the **metadata first** — names and strings frequently hand you the logic outright.
3. **Decompile where you can.** .NET and Java decompile back to near-original source; `.pyc` disassembles (and often decompiles) cleanly; `.wasm` reads as WAT.
4. **Expect obfuscation.** Protectors (for example .NET's ConfuserEx) **rename** everything to garbage, **encrypt strings**, and **flatten control flow** to spoil that free metadata — then you're back to reading bytecode directly, with the deobfuscation skills from Advanced level.

The habit to build: when a file **isn't native code**, don't force an x86 disassembly onto it. Recognise the runtime and switch to its view, where the program is usually far more readable than any stripped binary.
'''
