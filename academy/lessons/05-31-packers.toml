id = "l5-packers"
level = 5
order = 31
title = "Packers and unpacking"
summary = "Why a packed binary looks like noise, how to recognise one, and how to get to the real code."
badge = "Unpacker"

[[steps]]
title = "What is a packer?"
text = '''
A **packer** takes a finished program, **compresses or encrypts** its real code and data into a blob, and glues on a small **unpacking stub**. When you run the packed file, the stub does its work first: it decompresses/decrypts the original program back into memory, then **jumps to it**.

Packers exist for good reasons (smaller files, UPX) and bad ones (hiding malware from scanners and analysts). Either way, the effect on static analysis is the same: on disk, the real program isn't there in a readable form yet — only the stub and a blob are.

So if you open a packed binary and the disassembly looks like garbage with almost no recognisable logic, that's expected. You're looking at the wrapper, not the program.
'''

[[steps]]
title = "Why packed code looks wrong"
text = '''
A packed executable has a very different shape from a normal one:

- A **tiny code section** (just the stub) and a **large, high-entropy section** (the packed blob).
- **Very few imports** — the stub resolves the real imports *at runtime*, after unpacking, so the import table on disk is nearly empty.
- Odd **section names** (`UPX0`/`UPX1` for UPX, random-looking names for others) and a section that's writable *and* executable.
- The stub ends with a **tail jump** into the section it just unpacked — a jump into what looked like data. That target is the **Original Entry Point (OEP)**: where the real program starts.

Spotting these on disk tells you to switch strategy: you'll have to let the program unpack itself and grab the result.
'''

[[steps]]
title = "Recognising a packer"
text = '''
You open an executable. Which combination most strongly says "this is packed"?
'''
check = { kind = "choice", options = [
  "High entropy, almost no imports, and a jump from the stub into a non-code section",
  "It's a large file",
  "It imports many Windows APIs",
  "It has lots of printable strings",
], correct = 0 }
hints = [
  "A normal program imports plenty of APIs and has readable strings; a packed one hides both until runtime.",
  "High entropy + a nearly empty import table + a tail jump to the OEP is the classic trio.",
]
success = "Right — high entropy, a stripped import table, and a tail jump into 'data' are the tell-tale signs."

[[steps]]
title = "Entropy"
text = '''
**Entropy** measures how random a chunk of bytes is. Normal x86 code sits around 6 bits per byte; English text is lower. Compressed or encrypted data looks *random*, so its entropy climbs close to the maximum.

What is the maximum possible entropy of a byte, in bits? (A byte has 256 possible values.)
'''
check = { kind = "answer", answers = ["8"], number = true }
hints = ["Entropy in bits is log2(number of possible values). For a byte that's log2(256)."]
success = "8 bits — and packed sections push right up near it, which is why high entropy flags packing."

[[steps]]
title = "Let ORRESS flag it"
text = '''
ORRESS watches for exactly this: a section's entropy above ~7.2 (near the 8-bit maximum), or a known packer's signature. When it sees them, the **Triage** tab classifies the file as **packed** and tells you the real logic is hidden until it's unpacked.

Open the Triage tab (View menu or the command palette).
'''
check = { kind = "action", id = "view::Triage" }
spotlight = "view.Triage"
hints = ["Ctrl+Shift+P, then type \"Triage\" — or the View menu."]

[[steps]]
title = "Getting to the real code"
text = '''
You can't read what isn't unpacked yet, so you make the program unpack itself and capture the result:

1. **Run it to the OEP.** Set a breakpoint after the unpacking stub (often right at that tail jump into the unpacked section), or single-step it in the **Emulator**. When execution reaches the OEP, the real program is now sitting in memory, decrypted.
2. **Dump the unpacked image** from memory and **re-analyze the dump** — now the disassembly, imports and strings are all there.
3. **Known packer?** Use its unpacker directly — for UPX, `upx -d` restores the original in one step.

That's the whole game: recognise packing from its shape, let it unpack, then analyse the real thing. For malware, always do this in a safe lab (see the Malware Analysis level).
'''
