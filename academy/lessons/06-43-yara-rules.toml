[[steps]]
title = "Pick a distinctive string"
goal = "Choose a marker that identifies the sample but not clean files."
text = '''
A good rule keys on something **distinctive and stable** -- a string that appears in this sample
(and its variants) but not in thousands of benign programs. Compiler boilerplate like
`"This program cannot be run in DOS mode"` is in *every* PE, so it is useless for identification.

crackme15 carries a unique marker string planted for exactly this purpose. If you open the
**Strings** view (Ctrl+Shift+S) and filter for `ORRESS`, you will find it: a single, unmistakable
identifier beginning `ORRESS_TRAINING`.

What is that full marker string? (It begins `ORRESS_TRAINING_...`.)
'''
instructions = [
    "Open the **Strings** view (press **Ctrl+Shift+S**).",
    "In the filter box, type `ORRESS` to narrow the list.",
    "Type the full marker string (the one beginning `ORRESS_TRAINING_`) and press Check.",
]
check = { kind = "answer", answers = ["ORRESS_TRAINING_SAMPLE_v1"], number = false, case_sensitive = true }
spotlight = "tree.Strings"
hints = [
    "Filter the Strings view for ORRESS.",
    "It is one token, no spaces, ending in a version like _v1.",
    "The marker is ORRESS_TRAINING_SAMPLE_v1 (match the capitals exactly).",
]
success = "ORRESS_TRAINING_SAMPLE_v1 -- distinctive, stable and unique to this sample. That is exactly the kind of string to build a rule around."

[[steps]]
title = "Write and test your rule"
goal = "Write a rule in the workbench that matches the sample and scan it."
text = '''
Now write the rule. Go to the **YARA workbench** (Ctrl+Shift+Y) and replace the example with a
rule keyed on the marker you found:

```text
rule orress_training_sample {
    meta:
        author = "you"
        description = "matches the ORRESS Level 6 training sample"
    strings:
        $marker = "ORRESS_TRAINING_SAMPLE_v1"
    condition:
        $marker
}
```

Then click **Scan open file**. With crackme15 active you should see one match: rule
`orress_training_sample`, pattern `$marker`, with its offset and a byte preview.

Because this marker is unique to the training sample, the same rule run against crackme01 (the
Level 1 password crackme) would **not** match -- a true positive here, no false positive there.
That is a working detection. When you are done, continue.
'''
instructions = [
    "Open the **YARA workbench** (**Ctrl+Shift+Y**).",
