id = "l0-numbers"
level = 0
order = 2
title = "Number systems"
summary = "Binary, hexadecimal, negative numbers and byte order."
badge = "Hex Reader"

[[steps]]
title = "Bits and binary"
text = '''
Computers store everything as **bits**: 0 or 1. Eight bits make a **byte**, which holds a number from 0 to 255.

Binary is base 2: each position is worth twice the one to its right. `0b0010_1010` is 32 + 8 + 2 = **42**. Rust lets you write binary literals directly:

```rust
let answer: u8 = 0b0010_1010;
assert_eq!(answer, 42);
```

Try the converter below: type `42`, then `0b101`, then `255`.
'''
widget = "number_converter"

[[steps]]
title = "Hexadecimal"
text = '''
Binary is long to read, so reversers use **hexadecimal** (base 16): digits `0`–`9` and `A`–`F` (A = 10 … F = 15). One hex digit is exactly 4 bits, so **two hex digits are one byte**. That is why hex is everywhere in ORRESS.

Hex numbers are written with `0x` in front, as in Rust:

```rust
let x = 0x2A; // 2 * 16 + 10
```

What is `0x2A` in decimal?
'''
widget = "number_converter"
check = { kind = "answer", answers = ["42"], number = true }
hints = [
    "Multiply the first digit by 16 and add the second.",
    "A is 10. So it is 2 * 16 + 10.",
]

[[steps]]
title = "Decimal to hex"
text = '''
Now the other way. Write **200** in hexadecimal, **with the `0x` prefix** (e.g. `0x1F`). (The converter will tell you if you get stuck, but try it in your head first: how many times does 16 fit in 200?)
'''
check = { kind = "answer", answers = ["0xC8"], number = true }
hints = [
    "16 fits 12 times in 200 (12 * 16 = 192). 200 - 192 = 8.",
    "12 is written C in hex.",
]

[[steps]]
title = "Negative numbers"
text = '''
A byte has no room for a minus sign. Instead, computers use **two's complement**: if the top bit is 1, the number is negative. The same bits mean different things depending on the type:

```rust
let byte: u8 = 0xFF;
assert_eq!(byte, 255);        // as unsigned
assert_eq!(byte as i8, -1);   // the same bits as signed
```

`0xFF` is -1, `0xFE` is -2, `0x80` is -128. In assembly you will often see `0xFFFFFFFF`: that is `-1` as a 32-bit number.

As an `i8`, what is `0xFE`?
'''
widget = "number_converter"
check = { kind = "answer", answers = ["-2"], number = true }
hints = ["0xFF is -1. One less is…"]

[[steps]]
title = "Byte order (endianness)"
text = '''
A `u32` takes 4 bytes. x86 and ARM computers store the **lowest byte first**: this is called **little-endian**.

```rust
let n: u32 = 0x1234_5678;
assert_eq!(n.to_le_bytes(), [0x78, 0x56, 0x34, 0x12]);
```

So in the hex view the number looks backwards. In memory you see the bytes `78 56 34 12`. Which `u32` is that? Write the answer in hex **with the `0x` prefix** — e.g. `0x1234`.
'''
check = { kind = "answer", answers = ["0x12345678"], number = true }
hints = [
    "Read the bytes from right to left.",
    "12, then 34, then 56, then 78.",
]
success = '''
You can now read hex dumps. ORRESS's Inspector panel shows the bytes under the cursor as numbers in both byte orders, so you never have to do this by hand again, but now you know what it does.
'''
