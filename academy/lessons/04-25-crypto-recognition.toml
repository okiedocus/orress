id = "l4-crypto-recognition"
level = 4
order = 25
title = "Recognising crypto"
summary = "Don't reverse cryptography from scratch — recognise the standard algorithm from its fingerprints, then attack it the right way."
badge = "Cipher Spotter"

[[steps]]
title = "Recognise, don't reinvent"
text = '''
Lots of CTF challenges and real malware lean on cryptography: a password is hashed and compared, a flag is AES-encrypted, a config is XORed then Base64'd. When you hit crypto, the worst thing you can do is try to understand the maths instruction by instruction.

Almost always, it's a **standard algorithm** — AES, MD5, SHA-256, RC4, TEA. You don't need to re-derive it. You need to **recognise** it. The moment you know "that's AES" or "that's a CRC32", you instantly know its structure, its weaknesses, and how to attack it — decades of cryptanalysis are suddenly on your side.

So the skill here isn't breaking crypto. It's **identifying** it fast, then choosing the right attack.
'''

[[steps]]
title = "Constants are the fingerprint"
text = '''
The single best tell is **magic constants**. Standard algorithms are full of fixed numbers and tables that appear nowhere else, so spotting one is a near-certain identification:

- **AES** — its 256-byte **S-box** (starts `63 7C 77 7B F2 6B ...`) and the round constants (Rcon).
- **MD5** — initial values `0x67452301`, `0xEFCDAB89`, ... and sine-derived round constants.
- **SHA-256** — initial values starting `0x6A09E667` (fractional bits of prime square roots) and round constants starting `0x428A2F98`.
- **SHA-1** — the round constants `0x5A827999`, `0x6ED9EBA1`, ...
- **CRC32** — the polynomial table built from `0xEDB88320`.
- **TEA / XTEA** — the "delta" constant `0x9E3779B9` (from the golden ratio).
- **ChaCha / Salsa20** — the 16-byte ASCII string `"expand 32-byte k"` baked into the state.
- **RC4** — no numeric constant, but a tell-tale loop that fills a 256-byte array with `0,1,2,...` (the key-scheduling setup).

See one of these and you've named the algorithm.
'''

[[steps]]
title = "The fastest identification"
text = '''
You've opened a function doing a lot of shifts, XORs and table lookups. What's the quickest, most reliable way to find out which crypto algorithm it is?
'''
check = { kind = "choice", options = [
  "Look for its unique magic constants and tables (S-boxes, IVs, round constants)",
  "Run it and measure how long it takes",
  "Count how many functions the binary has in total",
  "Read the file's name and trust it",
], correct = 0 }
hints = [
  "Each standard algorithm carries numbers that appear in nothing else.",
  "A single matched constant (an S-box, an IV, a delta) names the algorithm immediately.",
]
success = "Right — a matched magic constant is an instant, reliable identification; timing and function counts tell you almost nothing."

[[steps]]
title = "Read a fingerprint"
text = '''
Here's one to recognise. The **ChaCha** and **Salsa20** stream ciphers build their initial state around a fixed 16-byte ASCII string — if you see those exact bytes as text in a binary, it's almost certainly one of them.

The string is `expand 32-byte k`. Type its **first word**.
'''
check = { kind = "answer", answers = ["expand"], number = false, case_sensitive = false }
hints = ["It's the first word of `expand 32-byte k`.", "Four letters: e-x-p-a-n-d."]
success = "expand — spotting `expand 32-byte k` in the strings or data is a dead giveaway for ChaCha/Salsa20."

[[steps]]
title = "Let ORRESS point you at it"
text = '''
ORRESS helps you get there. When a binary imports cryptographic routines, the **Triage** tab classifies it as **a crypto challenge** and, in its graded **Challenge hints**, suggests identifying the algorithm from exactly these constants (AES S-box, SHA/MD5 IVs, TEA delta, RC4 KSA, ChaCha's `expand 32-byte k`) and then finding **where the key and your input meet**.

From there you confirm it yourself: hunt the constants in the **Strings** and **Hex** views, and match a 256-byte table or a distinctive IV.

Open the **Triage** tab (the View menu, or the command palette) and read its challenge hints.
'''
check = { kind = "action", id = "view::Triage" }
spotlight = "view.Triage"
hints = ["Ctrl+Shift+P, then type \"Triage\" — or the View menu. Reveal the Challenge hints."]

[[steps]]
title = "From recognition to attack"
text = '''
Naming the algorithm chooses your attack:

1. **Reversible cipher with the key present** (AES/RC4/TEA, key hard-coded or derivable) -> recover the key, then just **decrypt**. Recognition tells you which decryption to run.
2. **Hash-then-compare** (MD5/SHA of your input == stored digest) -> hashes are **one-way**, so you can't invert them. Attack the input space instead: a dictionary/brute force if it's a short password, or a known structure.
3. **Custom XOR / transform-and-compare** -> this is the byte-wise check from the Symbolic Execution lesson: mark the win block and let the solver recover the input.
4. **Public-key / big-integer modular math** (RSA) -> recognise it by giant-number arithmetic, then look for the classic parameter mistakes.

Structure helps when constants are stripped: 256-entry tables mean an S-box; 16/20/64 rounds of rotate-and-mix mean a block/stream cipher; huge modular multiplications mean public-key. Recognise first, then bring the right tool. That's how experts beat crypto challenges in minutes instead of days.
'''
