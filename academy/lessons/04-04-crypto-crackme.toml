id = "l4-crypto-crackme"
level = 4
order = 26
title = "Practice: decrypt the flag"
summary = "Finish crackme13: find the TEA key and the encrypted flag inside the program, then decrypt it in the Workbench."
goals = [
    "find a cipher's key and ciphertext inside a program",
    "understand an encrypt-and-compare check",
    "read a 16-byte key as four little-endian 32-bit words",
