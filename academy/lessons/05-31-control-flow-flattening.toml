[[steps]]
title = "Let ORRESS unflatten it"
goal = "Use the decompiler and find the deobfuscation note."
text = '''
With the cursor inside that function, open the **Decompiler**. ORRESS lifts the machine
code to Rust-style pseudocode — and as it does, it **undoes the flattening**: it works out
each arm's real successor from the state variable, relinks them, and drops the dispatcher.

At the very top of the output you will see the note:

```
// deobfuscated by ORRESS: control-flow flattening undone
```

Below it, the jumbled dispatcher is gone and the function reads as the straight-line check
it always was: a length test, then one comparison per input byte. That note is your signal
that the clean code you are reading was reconstructed, not copied byte-for-byte from disk.
'''
instructions = [
  "Make sure the cursor is inside the flattened check function in the **Disassembly** view.",
  "Open the **Decompiler**: press **F5**, or **View** menu -> **Open View** -> **Open Decompiler**.",
  "Read the first line of the output and confirm it says `// deobfuscated by ORRESS: control-flow flattening undone`.",
]
spotlight = "view.Decompiler"
check = { kind = "action", id = "view::Decompiler" }
hints = [
  "F5 decompiles the function under the cursor. If it says to put the cursor in a function, click inside the check function in the disassembly first.",
  "The deobfuscation note is the very first line, a green comment.",
]
success = "The decompiler relinked the arms and dropped the dispatcher. What took the obfuscator all that work to hide, ORRESS put back in a second."

[[steps]]
title = "Read the key out of the clean code"
goal = "Recover the password from the deobfuscated pseudocode."
text = '''
Now read the recovered check. Each arm compares one input byte against a fixed value.
ORRESS shows them as characters where it can, so the pseudocode reads like:

```
if read::<u8>(rcx) == b'u' { ... }
if read::<u8>(rcx + 1) == b'n' { ... }
if read::<u8>(rcx + 2) == b'f' { ... }
// ...
```

Read the required byte from each arm, in order, and you have the password. (If a byte
shows as a hex number instead of a character, convert it: `0x75` is `'u'`, `0x6e` is
`'n'`, and so on — the ASCII table widget in earlier lessons does this, or the number
converter.)

Type the 8-character key the check demands.
'''
instructions = [
  "In the deobfuscated pseudocode, read the byte each arm compares, from offset 0 to 7.",
  "Assemble them into one 8-character string.",
  "Type that string and press Check.",
]
check = { kind = "secret", sha256 = "5b32bfdd2311089e3a34de1daca5e74bc5b557a02b358d99dc1bfae7fdc2c2da" }
hints = [
  "The first three characters are `u`, `n`, `f`. It is a leet-speak word about this very technique.",
  "Think \"unflatten\", trimmed to 8 characters with leet substitutions.",
  "The key is `unfl4tt3`.",
]
success = "That is the key. You beat control-flow flattening: you recognised the dispatcher shape, let ORRESS relink it, and read the logic straight out. The crackme's source is now unlocked below — compare the flattened `match` to the clean check ORRESS recovered."
