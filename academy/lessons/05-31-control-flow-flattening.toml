The check function is the large one with many blocks — in the **Functions** list it stands
out by its block count (around 36 blocks for roughly 100 lines of logic: that bloat is the
flattening). Open it and you will see the dispatcher at the top and the arms scattered
below, each ending by loading a number into a register and jumping back.
'''
instructions = [
