id = "l5-control-flow-flattening"
level = 5
order = 31
title = "Control-flow flattening"
summary = "A function chopped into one dispatcher loop: how it hides the logic, how to unflatten it, and how ORRESS undoes it automatically."
badge = "Flattener Foiled"
reveal_source = "crackme08"
goals = [
    "recognise control-flow flattening from its dispatcher-and-state-variable shape",
    "unflatten a function by hand by following the state variable",
    "use ORRESS's decompiler to undo the flattening automatically",
    "recover the key of a flattened crackme",
]

[[steps]]
title = "A straight line, chopped up"
goal = "See what flattening does to ordinary code."
text = '''
Here is a normal key check, the kind you can read top to bottom:

```rust
if input.len() != 8 { return false; }
if input[0] != b'u' { return false; }
if input[1] != b'n' { return false; }
// ... and so on, then:
return true;
```

**Control-flow flattening** destroys that readable order. It turns every step into an arm
of one big `match`, inside a loop, and adds a **state variable** that chooses which arm
runs next:

```rust
let mut state = 0;
loop {
    match state {
        0 => { if input.len() != 8 { return false; } state = 1; }
        1 => { if input[0] != b'u' { return false; } state = 2; }
        2 => { if input[1] != b'n' { return false; } state = 3; }
        // ...
        9 => return true,
        _ => return false,
    }
}
```

Both versions do exactly the same thing. But the second hides the real order inside the
state numbers. Read the arms in the file and they appear in whatever jumbled order the
compiler emitted them — not `0,1,2,...`. The obfuscator OLLVM produces exactly this shape.
'''

[[steps]]
title = "The dispatcher and the state variable"
goal = "Name the two parts that make flattening work."
text = '''
A flattened function has two moving parts:

- The **dispatcher**: the block at the top of the loop that reads the state variable and
  jumps to the matching arm. Because *every* arm jumps back to it, the dispatcher is a
  single block with dozens of incoming edges — very high **fan-in**.
- The **state variable**: a plain integer (often in a register, here it would be one
  register holding `state`) that each arm sets before looping back, naming the next arm.

So control does not flow arm-to-arm the way the source did. It always bounces back through
the dispatcher: *arm -> dispatcher -> next arm -> dispatcher -> ...*. In the disassembly
you will see a `jmp` table or a chain of compares on one register, and every arm ending by
setting that register and jumping to one shared address.

That "one block everything returns to, inside a loop" shape is the same fingerprint a VM
interpreter has — which is why ORRESS's VM detector flags flattened functions too.
'''
deep_dive = '''
Compilers love to prove the state machine is really just a sequence and collapse it back
into straight-line code. To stop that (so the binary stays flattened for you to study),
crackme #8 passes the state through a `black_box`, an optimisation barrier. Real
obfuscators achieve the same with opaque operations on the state variable that the
compiler cannot see through.
'''

[[steps]]
title = "Spot the flattening"
goal = "Identify flattening from a description."
text = '''
You open a function and it is one loop containing a big switch on a single register, and
every block ends by setting that register and jumping back to the top. Which obfuscation
is this?
'''
check = { kind = "choice", options = [
  "Control-flow flattening: a dispatcher loop driven by a state variable",
  "Packing: the code is compressed on disk",
  "Opaque predicates and nothing else",
  "A normal `for` loop over an array",
], correct = 0, explain = [
  "Right — one dispatcher, one state register, every block looping back: that is flattening.",
  "Wrong — packing is about compressed/encrypted bytes on disk, not a dispatcher loop. The code here is fully present.",
  "Wrong — opaque predicates are fake always-true/false branches; they can appear alongside flattening but are not this shape.",
  "Wrong — a real loop iterates data; here the 'loop' only exists to re-enter the dispatcher for each original block.",
] }
success = "The dispatcher-plus-state-variable shape is the signature of flattening. Now you will undo it."

[[steps]]
title = "Unflattening by hand"
goal = "Learn the manual recipe before letting the tool do it."
text = '''
To unflatten a function yourself, you rebuild the real order from the state numbers:

1. **Find the dispatcher** and the **state variable** (the register it switches on).
2. **List the arms**: for each state value, note what the arm does and which state it sets
   next. For crackme #8, arm for state 1 checks `input[0]` then sets state 2; arm for
   state 2 checks `input[1]` then sets state 3; and so on.
3. **Follow the chain** from the start state. The dispatcher starts at state 0; follow
   `0 -> 1 -> 2 -> ...` through the "set next state" values, ignoring the jumbled order the
   arms sit in on screen.
4. **Relink**: write the arms out in that real order, drop the dispatcher and the state
   variable, and you have the original straight-line logic back.

It is bookkeeping, not magic — and exactly the kind of bookkeeping a tool can do for you.
'''

