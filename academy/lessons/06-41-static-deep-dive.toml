id = "l6-static-deep-dive"
level = 6
order = 41
title = "Static deep dive"
summary = "Beyond the triage summary: open the training sample, read its suspicious imports, and decode its hidden configuration -- all without running it."
badge = "Config Cracker"
reveal_source = "crackme15"
goals = [
    "open the harmless training sample and confirm what it is from the Info view",
