id = "l1-instructions"
level = 1
order = 7
title = "Core instructions"
summary = "Arithmetic, comparisons, jumps and loops: how Rust's if and for look in assembly."

[[steps]]
title = "Arithmetic"
text = '''
`add rax, rbx` means `rax += rbx`; `sub rax, 5` means `rax -= 5`. The first operand is both an input and the result.

In the simulator, compute **10 + 20 − 5** so that the result ends up in `rax`. Use `add` and `sub`.
'''
sim_code = '''
; rax = 10 + 20 - 5
mov rax, 10
'''
check = { kind = "sim", expect = [["rax", 25]], requires = ["add", "sub"] }
hints = ["add rax, 20", "Then subtract 5 from rax."]
solution = '''
mov rax, 10
add rax, 20
sub rax, 5
'''

[[steps]]
title = "if/else: compare and jump"
text = '''
```rust
let rbx = if rax == 7 { 1 } else { 2 };
```

has no `if` in assembly. It becomes a comparison and a **conditional jump**:

```text
    cmp rax, 7
    jne else_branch    ; jump if Not Equal (ZF = 0)
    mov rbx, 1
    jmp done
else_branch:
    mov rbx, 2
done:
```

Labels like `done:` mark places to jump to. Write this in the simulator (rax is already 7) so that `rbx` ends up **1**.
'''
sim_code = '''
mov rax, 7
; rbx = 1 if rax == 7, otherwise 2
'''
check = { kind = "sim", expect = [["rbx", 1]], requires = ["cmp"] }
hints = ["Copy the example above under the first line.", "Do not forget the jmp done, otherwise the else branch runs too."]
solution = '''
mov rax, 7
cmp rax, 7
jne else_branch
mov rbx, 1
jmp done
else_branch:
mov rbx, 2
done:
'''

[[steps]]
title = "Loops"
text = '''
A loop is a jump **backwards**:

```rust
let mut sum = 0;
for i in 1..=5 {
    sum += i;
}
```

```text
    xor rax, rax      ; sum = 0  (x xor x is always 0)
    mov rcx, 1        ; i = 1
again:
    add rax, rcx      ; sum += i
    inc rcx           ; i += 1
    cmp rcx, 6
    jne again         ; repeat until i == 6
```

Write a loop that puts **1 + 2 + 3 + 4 + 5 = 15** in `rax`.
'''
sim_code = '''
; rax = 1 + 2 + 3 + 4 + 5 using a loop
'''
check = { kind = "sim", expect = [["rax", 15]], requires = ["cmp"] }
hints = ["The example above is the answer; type it in to feel how it works.", "Step through it and watch rcx count up."]
solution = '''
xor rax, rax
mov rcx, 1
again:
add rax, rcx
inc rcx
cmp rcx, 6
jne again
'''

[[steps]]
title = "XOR"
text = '''
`xor` flips bits: each result bit is 1 when exactly one of the two input bits is 1. It shows up constantly:

- `xor eax, eax` sets eax to 0 (shorter than `mov eax, 0`).
- XOR with a key is the most common "encryption" in CTF challenges: `x ^ key ^ key == x`, so the same operation encrypts and decrypts.

```rust
assert_eq!(0x55 ^ 0xFF, 0xAA);
```

What is `0x0F ^ 0xFF`? (Answer in hex.)
'''
widget = "number_converter"
check = { kind = "answer", answers = ["0xF0"], number = true }
hints = ["0xFF has all bits set, so xor with it flips every bit.", "0x0F is 0000 1111; flipped that is 1111 0000."]

[[steps]]
title = "Signed or unsigned?"
text = '''
After `cmp`, different jumps read the flags differently:

| Rust types | less than | greater than |
|---|---|---|
| `i32`, `i64` (signed) | `jl` | `jg` |
| `u32`, `u64` (unsigned) | `jb` (below) | `ja` (above) |

So the jump tells you the **type** of the variables, information the compiler otherwise threw away. A program does `cmp eax, 10` then `jb small`. Was the variable signed or unsigned?
'''
check = { kind = "choice", options = ["Signed, like i32", "Unsigned, like u32", "It cannot be known"], correct = 1 }
success = "Right: jb (below) and ja (above) are the unsigned jumps."
