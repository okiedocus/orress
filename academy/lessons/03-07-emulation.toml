    "Think about the one-function-in-isolation strength, not whole-program execution.",
    "Feed a routine an input and read its output, with no environment to set up.",
]
success = '''
The emulator is for running a self-contained routine on chosen inputs and reading exactly what it produces. Now use it on crackme #2's password check.
'''

[[steps]]
title = "Run the check"
goal = "Emulate crackme #2's password check with the right password."
text = '''
Open crackme #2 and the **Emulator** view (**F7**). You will run just its password check, the function at `0x140001100`, and nothing else.

The check is a Rust function that takes the password as a byte slice: a pointer and a length. The Emulator's **Run function** puts your input string into a scratch buffer and passes a pointer to it as the first argument (`rcx`). If you tick **pass input length as arg1**, it also passes the length (`rdx`). This check compares the length to 7 first (`cmp rdx, 7`), so you must pass the length, or it rejects everything as the wrong size.

Set the **Function address** to `0x140001100`, type `R3v3rs3` as the **Input**, tick **pass input length as arg1**, and press **Run**. ORRESS shows the **return value in RAX** (as hex, unsigned and signed) and how many instructions it ran.

The check returns a `bool`, which lives in the low byte of `RAX` (called `al`): `1` for a match, `0` for no match. With the correct password, what are the last two hex digits of RAX (its `al`)?
'''
instructions = [
    "Open crackme #2 (button below) and the **Emulator** view (**F7**).",
    "Set **Function address** to `0x140001100`.",
    "Type `R3v3rs3` as the **Input**.",
    "Tick **pass input length as arg1**, then press **Run**.",
    "Read the RAX value and type its last two hex digits.",
]
spotlight = "view.Emulator"
check = { kind = "answer", answers = ["1", "01", "0x01"], number = true }
hints = [
    "The return value is in RAX; the bool is its low byte, al.",
    "A correct password makes the check return true.",
    "true is 1, so RAX ends in 01.",
]
success = '''
RAX ends in `01`: `al = 1`, the check returned `true`, all on a simulated CPU without running the program. (The upper bytes of RAX are leftovers; only `al` carries the `bool`.)
'''

[[steps]]
title = "Try a wrong one"
goal = "See the return value change with the input."
text = '''
Now change the **Input** to something wrong but still seven characters long, say `R3v3rsX`, keep **pass input length** ticked, and press **Run** again.

This time RAX ends in `00`: `al = 0`, the check returned `false`. Change it back to `R3v3rs3` and `al` is `1` again. The emulator is deterministic, so the same input always gives the same answer, and you can sweep inputs as fast as you can type them.

Try one more: untick **pass input length** and run `R3v3rs3` again. Now RAX is `0`, and the instruction count is tiny. Without the length in `rdx`, the very first check (`cmp rdx, 7`) fails and the function returns at once. That is a useful reminder: you have to set up a function's arguments the way its caller does, or you are testing something else.
'''
instructions = [
    "Set **Input** to `R3v3rsX` (seven characters), keep **pass input length** ticked, press **Run**. RAX ends in `00`.",
    "Set **Input** back to `R3v3rs3`, press **Run**. RAX ends in `01` again.",
    "Untick **pass input length**, run `R3v3rs3`: RAX is `0` and far fewer instructions run.",
]
spotlight = "view.Emulator"
check = { kind = "continue" }
hints = [
    "al is the last two hex digits of RAX: 01 for the right password, 00 for a wrong one.",
    "Without the length argument, the length check fails first and the function returns immediately.",
]
success = '''
You watched the return value track the input, and saw how a missing argument changes everything. Setting up arguments correctly is most of using the emulator well.
'''

[[steps]]
title = "Workflow and limits"
goal = "Know when to reach for the emulator and when not to."
text = '''
Put the emulator to work:

1. **Confirm what a routine does.** Feed it an input, Run, and read **RAX** and the **Scratch buffer after run**. Returning a `bool`? Decoding bytes in place? The output tells you, without your reading every instruction.
2. **Run code you otherwise could not.** Wrong operating system, missing libraries: none of it stops the emulator from running a self-contained function. This is the Linux and macOS path through much of this level.
3. **It powers the solvers.** The same engine underlies the side-channel and symbolic solvers and the time-travel recorder you meet in later levels. Emulation is the foundation they build on.

Know the edges too. The emulator models a large but not complete set of instructions (integer, branch, stack, memory and the common SSE2 used for slice comparisons) and almost none of the OS, so heavy system calls, threads or GUI code will not run. When it cannot proceed, it stops and tells you, for example an unsupported instruction or a memory fault. Aim it at **self-contained computation** and it rarely lets you down.

So: **debugger** for the whole program on a real CPU; **emulator** for one function on a simulated CPU. Reach for whichever fits the question.
'''

[[steps]]
title = "What you can do now"
goal = "Sum up emulation."
text = '''
You can now run a function in isolation:

- open the **Emulator** (**F7**) and point it at a **function address**;
- pass an **input** (as a pointer) and, when the function needs it, its **length**;
- press **Run** and read the **return value in RAX** (its low byte `al` for a `bool`) and the **scratch buffer**;
- sweep inputs quickly, because the simulated CPU is deterministic and has no side effects;
- and run self-contained code on any operating system, while knowing the emulator's limits.

That is three ways to run code under your control: the debugger, patching, and the emulator. In the last two lessons of this level you use them against programs that try to stop you: crackme #4, which notices the debugger, and crackme #12, which stacks three such tricks.
'''
