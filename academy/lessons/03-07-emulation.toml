id = "l3-emulation"
level = 3
order = 7
title = "Emulation"
summary = "Run one function on a simulated CPU inside ORRESS. Feed crackme #2's check the password and read its yes/no answer, with no real execution and no operating system."
badge = "CPU Whisperer"
goals = [
    "say what an emulator is and how it differs from a debugger",
    "name the kind of code emulation is best for",
    "run a single function in the Emulator with an input you choose",
    "read the function's return value from RAX",
    "know the emulator's limits",
]

[[steps]]
title = "Running on a simulated CPU"
goal = "Understand what an emulator does."
text = '''
A debugger runs the program on your **real** processor. An **emulator** runs it on a **simulated** one: a CPU built in software that reads the machine code and carries out each instruction itself. ORRESS has one built in. You met a simple version in Level 1, the CPU simulator; the emulator is the same idea for real x86-64 code from a file.

Why fake the CPU when you could just run the program? Because an emulator can run **just a piece** of it. You point it at a single function, hand it some inputs, and read exactly what it produces, without launching the whole program, without its files or network, and without even needing the same operating system the program was built for.

For understanding one routine, a decoder, a hash, a password check, that isolation is a superpower. You saw it already in the last-but-one lesson, where you ran crackme #11's builder on its own and read the decoded password out of the scratch buffer. This lesson looks at the tool itself.
'''

[[steps]]
title = "Emulation next to debugging"
goal = "Compare the two ways of running code."
text = '''
You now know both ways to run code. They complement each other:

- **A debugger** runs the **whole program** on the **real** CPU and OS. It is the real thing: real input, real behaviour, real side effects. It needs the right operating system (Windows, for these crackmes), and anything the program does really happens.
- **An emulator** runs **one piece** on a **simulated** CPU, inside ORRESS. Nothing it does reaches your computer: system calls are intercepted, not performed, so no file, network or registry is touched. It runs the same on any operating system, because it never asks the real one to do anything.

Three things fall out of that:

- **No environment needed.** Run a Windows function on Linux, or code for another setup, without that setup.
- **No real side effects.** Running a snippet cannot harm your machine.
- **Deterministic and fully visible.** Same inputs, same result, every time, and you can read every register and byte afterwards.

The trade-off: the emulator models a **subset** of instructions and almost none of the operating system. A whole GUI app that makes thousands of OS calls will not "just run". Emulation shines on **self-contained computation**.
'''

[[steps]]
title = "What is it good for?"
goal = "Pick the emulator's sweet spot."
text = '''
Given those strengths and limits, what is the emulator best at?
'''
check = { kind = "choice", options = [
