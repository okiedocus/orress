id = "l3-patching"
level = 3
order = 20
title = "Patching"
summary = "Don't just read the program — change it. NOP a check, invert a jump, force a branch, and save a patched copy."
badge = "Byte Surgeon"

[[steps]]
title = "Changing the program"
text = '''
Reading a binary tells you what it does. Sometimes you want to **change** what it does: skip a licence check, force the "Correct!" path, silence a nag screen, or disable an anti-debug trap so you can keep analysing.

**Patching** is editing the program's actual bytes so it behaves the way you want. It's the classic way to beat a crackme — make the check always pass — and it's also a fast way to **test a hypothesis**: "if I remove this call, does the problem go away?" Change one instruction, run it, and see.

The edits are tiny and surgical. You're not rewriting the program; you're changing a jump here, deleting a check there.
'''

[[steps]]
title = "Three surgical edits"
text = '''
Almost all patching comes down to three moves, each on a single instruction:

- **NOP it out.** Replace an instruction with `NOP`s (no-operation) so it's **skipped entirely**. Perfect for deleting a call to an anti-debug or integrity check — the program runs as if it were never there.
- **Invert a conditional jump.** Flip the condition: `je` becomes `jne`, `jl` becomes `jge`, and so on. The program now takes the **other** branch at that fork.
- **Force a jump (always-jump).** Turn a conditional jump into an **unconditional** one, so it's taken no matter what the comparison was.

A one- or two-byte change, a completely different outcome. The skill is choosing *which* edit, at *which* instruction.
'''

[[steps]]
title = "Pick the patch"
text = '''
A check ends like this: `cmp` your input against the secret, then `je correct` — **jump to the "Correct!" block if they're equal**, otherwise fall through into "Wrong". You don't know the password. Which patch makes **every** input reach "Correct!"?
'''
check = { kind = "choice", options = [
  "Force the jump to be always-taken, so it lands on \"Correct!\" regardless of the comparison",
  "NOP out the je, so the jump never happens and everything falls through to \"Wrong\"",
  "Invert it to jne, so only wrong inputs pass and the real password now fails",
  "Rename the \"Correct!\" block to something friendlier",
], correct = 0 }
hints = [
  "You want to reach 'Correct!' no matter what cmp decided.",
  "A conditional jump to the win block, made unconditional, always reaches the win block.",
]
success = "Right — forcing `je correct` to always jump sends every input to 'Correct!'. NOP-ing it would make everything fail, and inverting it would only let wrong inputs through."

[[steps]]
title = "Patching in ORRESS"
text = '''
ORRESS patches right where you read. In the **Disassembly** view, put the cursor on an instruction and a **patch bar** appears for it, offering **NOP**, **Invert jump** and **Always jump** (plus **Undo patch** once you've changed it). Pick one and the bytes change immediately, with a running count of how many bytes you've patched.

Open the **Disassembly** view (Ctrl+D, the View menu, or the command palette) and land the cursor on an instruction to see the patch bar.
'''
check = { kind = "action", id = "view::Disassembly" }
spotlight = "view.Disassembly"
hints = ["Ctrl+D opens it — or Ctrl+Shift+P and type \"Disassembly\". The patch bar shows for the instruction under the cursor."]

[[steps]]
title = "The original file is safe"
text = '''
Here's the reassuring part: ORRESS keeps your patches as an **overlay stored with your project**, and **never modifies the file on disk**. You can toggle, undo, or "Revert All" at any time, and experiment freely — nothing is lost.

That means the patched bytes only run when you deliberately produce a patched build. To actually run the modified program, which action do you take — one word for writing the patched copy out?
'''
check = { kind = "answer", answers = ["save", "export", "write"], number = false, case_sensitive = false }
hints = ["The patch bar's button reads \"... patched file...\".", "You write a copy of the file with the patches baked in."]
success = "You save (export) a patched copy. The original stays pristine; the patched file is what you run or share."

[[steps]]
title = "Patch responsibly"
text = '''
A few habits keep patching clean:

1. **Smallest scope.** Patch the one jump or call that matters, not a whole block. The more you change, the more you can break.
2. **Know why it works.** A patch that passes the check without your understanding *why* is a guess. Read the logic first; patch to confirm it.
3. **Verify.** Save the patched copy and run or step it — did it actually behave as intended, with no side effects?
4. **Lean on reversibility.** Because patches are an overlay, try bold experiments ("what if this anti-debug call just... wasn't there?") and revert if they don't pan out.
5. **Stay safe with malware.** A patched malware sample is still malware — only ever run it in the lab from the Malware-Analysis track.

You've gone from reading a program to **rewriting its behaviour one instruction at a time**. NOP, invert, force, save — that's binary patching.
'''
