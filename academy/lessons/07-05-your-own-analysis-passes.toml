[[steps]]
title = "Graduation project"
goal = "Know the goal and the plan."
text = '''
This is the last lesson of the course. There is almost no hand-holding here: you use the skills from every level to solve one program, KeyVault 1.1 (**crackme18**), from start to finish, and recover its licence key.

You could brute-force a key check with the emulator's side-channel solver, or solve it symbolically. This time you do it the way an expert does by hand: understand the check, then compute the key directly. The plan is a checklist you can reuse on any crackme:

1. **Triage.** What is this file? Format, language, where to start.
2. **Locate.** Find the function that checks the key.
3. **Understand.** Read it in the decompiler. What does it compute?
4. **Recover.** Turn that understanding into a key, with a script that reads the program's own data.
5. **Verify.** Confirm the key works.

Open crackme18 and begin.
'''
instructions = [
    "Click the **Open crackme18** button below this text.",
]
check = { kind = "open_crackme", name = "crackme18" }
hints = ["The button is part of this lesson step."]
success = "crackme18 is open and analysed. Work the checklist."

[[steps]]
title = "Step 1 - Triage"
goal = "Read the file overview and note the language."
text = '''
Always start with **What Is This File?**. It tells you the format, the architecture, the language or compiler, the protections, and tips on where to start. Knowing it is a Rust program compiled for x86-64 Windows tells you what the disassembly and decompiler will look like.

Open the overview and read the **detected Language** line.
'''
instructions = [
    "With crackme18 active, press **Ctrl+I** (or **View > This File > File: What Is This File?**).",
    "Find the **detected Language** line (under the protections).",
    "Type the language name (one word) in the answer box and press **Check**.",
]
spotlight = "view.Info"
check = { kind = "answer", answers = ["rust"], number = false, case_sensitive = false }
hints = [
    "The line starts with `detected Language:`.",
    "It is the language this whole course prefers. Type `Rust`.",
]
success = "A stripped Rust program for x86-64 Windows, a console app. No packer, so the code is right there to read."

[[steps]]
title = "Step 2 - Locate the check"
goal = "Find the key-check function from main."
text = '''
The program reads a line and calls one function to check it, then prints "Access granted" or "Access denied". You find that function the same way as always: in `main`, look for the `call` whose result is immediately tested with `test al, al` (the returned `bool` is in `al`).

In crackme18's `main`, that test sits at `0x140001248`. The `call` on the line just above it is the check. Jump there and read the called address.
'''
instructions = [
    "Press **Ctrl+D** to open the **Disassembly**.",
    "Press **Ctrl+G**, type `140001248` and press **Enter**.",
    "Read the line just above `test al,al`: it is `call sub_...`.",
    "Type the called address (with `0x`) in the answer box and press **Check**.",
]
check = { kind = "answer", answers = ["0x1400012e0"], number = true }
hints = [
    "The line above `test al,al` is `call sub_1400012e0`.",
    "Type `0x1400012e0`.",
]
success = "The key check is `sub_1400012e0`. Now understand what it does."

[[steps]]
title = "Step 3 - Understand it"
goal = "Decompile the check and read what it computes."
text = '''
Reading a loop in assembly is slow. The **decompiler** turns it back into Rust-like code. Jump to the check and press **F5**. You will see roughly:

```rust
fn sub_1400012e0(a1: &[u8]) -> bool {
    if sub_140001100(a1, a1.len()) != 0 {        // a shape check (length + dashes)
        // ... every byte must be printable ...
        let mut rdx_2 = 0;
        while rdx_2 != 10 {
            if (a1[rdx_2] ^ 92) + rdx_2 != read::<u8>(rdx_2 + &data_140019478) {
                break;                            // wrong byte
            }
            rdx_2 += 1;
        }
    }
}
```

The important line is the comparison. Each key byte `a1[i]` is XORed with `92` (that is `0x5c`), then `i` is added, and the result must equal the `i`-th byte of a table in the program's data, `data_140019478`.

What is done to the key byte **before** `i` is added? Answer in one word.
'''
instructions = [
    "Press **Ctrl+G**, type `1400012e0` and press **Enter** (in the disassembly).",
    "Press **F5** to open the **Decompiler**.",
    "Read the line with `^ 92`. Type the operation applied to the key byte (one word) in the answer box and press **Check**.",
]
spotlight = "view.Decompiler"
check = { kind = "answer", answers = ["xor", "xored"], number = false, case_sensitive = false }
hints = [
    "`^` in Rust is one specific bitwise operation.",
    "`a1[i] ^ 92` is a bitwise XOR. Type `xor`.",
]
success = '''So the rule is `(key[i] ^ 0x5c) + i == ENC[i]`, where `ENC` is the table at `data_140019478`. Note that name, you need the address `0x140019478` next.'''

[[steps]]
title = "Step 4 - Recover the key"
goal = "Write a keygen script that reads ENC and inverts the rule."
text = '''
You know the rule and where the table is. Invert it: from `(key[i] ^ 0x5c) + i == ENC[i]` it follows that

```text
key[i] = (ENC[i] - i) ^ 0x5c
```

Let a script read the 10 table bytes and compute the key. `read(addr, len)` returns the bytes as numbers. The key is made of letters, digits and dashes, so you can turn each code into a character by looking it up in a small charset string (this avoids character literals):

```rhai
// Keygen for KeyVault 1.1.
let enc = read(0x140019478, 10);
print("ENC table: " + enc);
let charset = "-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let key = "";
for i in 0..10 {
    let code = ((enc[i] - i) ^ 0x5c) & 0xff;
    for c in charset { if c.to_int() == code { key += c; } }
}
print("key: " + key);
```

Open the Scripting console and run it.
'''
instructions = [
    "Open **View > Open View > Scripting console**.",
    "Clear the script box and paste the keygen above.",
    "Click **Run** and read the `key:` line in the output.",
    "Type the recovered key in the answer box (case matters) and press **Check**.",
]
spotlight = "view.Script"
check = { kind = "secret", sha256 = "a02124df865a2c5cc9633d5a7ef71f85d3346040060184c4acf548a43944cb0b" }
hints = [
    "The output prints the ENC table and then `key: ` followed by 10 characters.",
    "It has the shape XXX-XXXX-X, with two dashes.",
    "Type exactly what the script printed after `key: `.",
]
success = "Your script read the program's own table and computed the key, no guessing, no brute force. That is reverse engineering: understand, then produce."

[[steps]]
title = "Step 5 - Verify"
goal = "Confirm the key, and know how else you could have solved it."
text = '''
To be sure, you would run the program and paste the key: it prints "Access granted". You can do that any time from a terminal.

It is worth knowing the other roads to the same key, all taught in this course, so you can pick the fastest one next time:

- **Side-channel solver** (Level 4): the loop stops at the first wrong byte, so more correct bytes mean more instructions. The Emulator's instruction-counting solver recovers the key one byte at a time, without you reading the rule.
- **Symbolic solver** (Level 4): mark the "granted" block as the target and let the solver find an input that reaches it.
- **Time-travel** (this level): record the check with a near-miss key and read ENC and the loop counter straight from the trace.

You chose to understand the check and invert it, which is the most reliable: it gives the real key, and it tells you *why*.
'''

[[steps]]
title = "You did it"
goal = "Look back at the whole journey."
text = '''
That is the end of the Academy.

Look back at how far you came. You started at Foundations not knowing what a byte or a register was. You learned to read assembly, to use the decompiler, the debugger, the emulator and the Workbench. You beat anti-debugging, recognised crypto, solved checks with keygens, symbolic execution and side channels. You took apart packers, custom VMs and obfuscation, triaged malware safely and wrote YARA rules. In this last level you debugged backward through a recording, diffed a patch to find a fixed bug, learned how kernel drivers and rootkits work, and automated ORRESS with your own scripts.

Reverse engineering is a craft you get better at by doing. Pick a crackme from the CTF site, a program on your own machine, or an old game, and apply the checklist: triage, locate, understand, recover, verify. The tool is no longer something you only click through, it is something you can read, question and extend.

Go and take something apart.
'''
