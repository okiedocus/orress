id = "l1-stack"
level = 1
order = 8
title = "The stack and function calls"
summary = "push, pop, call and ret, and where local variables live."

[[steps]]
title = "push and pop"
text = '''
The **stack** is memory that works like a stack of plates: `push` puts a value on top, `pop` takes the top value off. `rsp` always points at the top. The stack grows **downward**: push makes rsp 8 smaller.

```rust
let mut stack: Vec<u64> = Vec::new();
stack.push(rax);          // push rax
let rbx = stack.pop();    // pop rbx
```

Use only `push` and `pop` to **swap rax and rbx**. Watch the Stack panel while you step.
'''
spotlight = "sim.stack"
sim_code = '''
mov rax, 1
mov rbx, 2
; swap rax and rbx using push and pop
'''
check = { kind = "sim", expect = [["rax", 2], ["rbx", 1]], requires = ["push", "pop"] }
hints = ["Push both values, then pop them back in the other order.", "The last value pushed is the first popped."]
solution = '''
mov rax, 1
mov rbx, 2
push rax
push rbx
pop rax
pop rbx
'''

[[steps]]
title = "call and ret"
text = '''
`call f` pushes the **return address** (where to continue afterwards) and jumps to `f`. `ret` pops that address and jumps back. Load the starting code, step through it, and watch the stack during the call.

What is in `rax` when the program ends?
'''
sim_code = '''
    mov rax, 3
    call triple
    ret              ; end of the program
triple:
    mov rbx, rax
    add rax, rbx
    add rax, rbx
    ret              ; back to the caller
'''
check = { kind = "answer", answers = ["9"], number = true }
hints = ["Press Load starting code, then Run."]

[[steps]]
title = "Write a function"
text = '''
Write a function `square` that computes `rax = rax * rax` with `imul rax, rax`, and **call** it with rax = 6.

```rust
fn square(x: u64) -> u64 { x * x }
let rax = square(6);
```
'''
sim_code = '''
    mov rax, 6
    ; call your function here
    ret
square:
    ; your function here
'''
check = { kind = "sim", expect = [["rax", 36]], requires = ["call", "imul"] }
hints = ["call square, after the mov.", "In square: imul rax, rax and then ret."]
solution = '''
    mov rax, 6
    call square
    ret
square:
    imul rax, rax
    ret
'''

[[steps]]
title = "Local variables"
text = '''
Rust local variables that do not fit in registers live on the stack. A function makes room by moving `rsp` down, and finds its variables relative to it:

```text
sub rsp, 0x28            ; reserve 0x28 bytes
mov [rsp+0x20], rcx      ; store a local variable
...
add rsp, 0x28            ; give the space back
ret
```

In the crackme disassembly you will see `[rsp+0x20]` and similar everywhere: those are local variables. What does `sub rsp, 0x28` do?
'''
check = { kind = "choice", options = [
    "Subtracts 0x28 from a variable named rsp",
    "Reserves 0x28 (40) bytes of stack space for local variables",
    "Jumps 0x28 bytes forward",
    "Frees 40 bytes of the heap",
], correct = 1 }
