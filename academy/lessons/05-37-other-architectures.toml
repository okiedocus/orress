]

[[steps]]
title = "Beyond x86"
goal = "See that the reversing skill transfers across architectures."
text = '''
Most reversing you have done so far is **x86 / x86-64** — the desktop and server world.
But a huge amount of code runs on other CPUs: **ARM64 (AArch64)** powers phones, Apple
Silicon Macs and many servers; **MIPS**, **RISC-V**, PowerPC and AVR show up in routers,
IoT gear and firmware.

The good news is that the *skill* transfers. Registers, a stack, calling conventions,
branches and the compiler's habits are universal — only the spelling changes. Once you
have read one architecture, picking up the next is mostly learning a new instruction table.

ORRESS decodes **x86 (32-bit)**, **x86-64** and **ARM64** today. Other embedded ISAs
(MIPS, RISC-V...) are on the firmware/hardware track; the approach in this lesson is
exactly how you would tackle them.
'''

[[steps]]
title = "RISC vs CISC"
goal = "Tell the two architecture families apart."
text = '''
Architectures fall into two broad families:

- **CISC** (x86): a **variable-length** encoding (1 to 15 bytes per instruction), many
  complex instructions, and arithmetic that can read memory directly (`add rax, [rbx+8]`).
  Compact code, but messy to decode.
- **RISC** (ARM64, MIPS, RISC-V): **fixed-width** instructions, a smaller, regular
  instruction set, lots of registers, and a **load/store** rule — arithmetic happens only
  between registers, and memory is touched only by dedicated `load`/`store` instructions.

That difference shapes how the code looks. RISC programs shuffle values through registers
and do explicit loads and stores around every computation, where x86 folds the memory
access into the operation.
'''
deep_dive = '''
The names are historical. CISC chips grew rich instruction sets when programmers wrote
assembly by hand and memory was scarce, so one dense instruction did a lot. RISC came from
the insight that compilers emit mostly simple operations, so a small, regular, fast set
with many registers wins. Modern x86 is CISC on the outside but cracks instructions into
RISC-like micro-operations internally.
'''

[[steps]]
title = "Fixed-width instructions"
goal = "Learn ARM64's instruction size and why it helps."
text = '''
A defining RISC trait is that **every instruction is the same size**. ARM64 (and ARM's
older 32-bit mode, and MIPS, and RISC-V's base set) use one fixed width, which makes linear
disassembly trivial: you never have to guess where the next instruction starts.

How many **bytes** is a single ARM64 (AArch64) instruction?
'''
instructions = [
  "Recall that an ARM64 instruction is a 32-bit word, and a byte is 8 bits.",
  "Type the number of bytes and press Check.",
]
check = { kind = "answer", answers = ["4"], number = true }
hints = ["It is a 32-bit instruction word. 32 bits divided by 8 bits per byte.", "ARM64 instructions are 4 bytes each; x86 ranges from 1 to 15."]
success = "4 bytes — fixed. That is why a RISC disassembler can step 4 bytes at a time, while an x86 one must decode each instruction to learn its length."

[[steps]]
title = "The load/store model"
goal = "Explain why RISC code loads, computes, then stores."
text = '''
You are reading ARM64 for the first time and you see a value loaded into a register,
modified, then stored back — instead of being changed in place in memory. Which statement
about RISC explains why?
'''
check = { kind = "choice", options = [
  "Arithmetic works only on registers; memory is reached only through explicit load and store instructions",
  "ARM64 has no registers, so everything lives in memory",
  "ARM64 cannot do arithmetic at all",
  "It is a bug in the compiler",
], correct = 0, explain = [
  "Right — the load/store model forbids arithmetic on memory, so RISC code loads, computes in registers, then stores back.",
  "Wrong — ARM64 has 31 general registers (`x0`-`x30`); it has more registers than x86, not none.",
  "Wrong — ARM64 does full arithmetic; it just requires the operands to be in registers first.",
  "Wrong — this is the normal, correct shape of RISC code, not a compiler mistake.",
] }
hints = [
  "Think about what 'load/store architecture' means for where computation can happen.",
  "On x86 you can add straight to memory; on RISC you must load into a register first, compute, then store.",
]
success = "The load/store model forbids arithmetic on memory, so RISC code loads, computes in registers, then stores back. ARM64's registers are `x0`-`x30`, with `x30` doubling as the link register that holds a call's return address."

[[steps]]
title = "ORRESS picks the ISA for you"
goal = "Open the disassembly and know the decoder is chosen automatically."
text = '''
You do not choose the architecture by hand: when ORRESS loads a file it reads the
executable's header (PE, ELF or Mach-O), detects whether it is x86, x86-64 or ARM64, and
wires up the right decoder. The **Disassembly**, graph and decompiler views then work the
same way they do for x86 — same UI, different instruction set.

Open the **Disassembly** view on any crackme to see decoded instructions. The crackmes in
this Academy are x86-64, so you will see familiar `rax`/`rcx` and variable-length
instructions; open an ARM64 binary and the very same view would show `x0`-`x30`,
fixed 4-byte instructions, and explicit loads and stores.
'''
instructions = [
  "Open any crackme (for example click **Open crackme05** on this step, or use a file you already have open).",
  "Open the **Disassembly** view: press **Ctrl+D**, or **View** menu -> **Open View** -> **File: Disassembly**.",
  "Note the status bar / Info view reports the detected architecture (here, x86-64).",
]
spotlight = "view.Disassembly"
check = { kind = "action", id = "view::Disassembly" }
hints = ["Ctrl+D opens the disassembly.", "You can also open the command palette with Ctrl+Shift+P and type \"Disassembly\"."]
success = "ORRESS detected the architecture from the file header and decoded it for you. The workflow you learned on x86 is the same workflow for ARM64."

[[steps]]
title = "Stepping into an unfamiliar ISA"
goal = "Have a repeatable method for any new architecture."
text = '''
When you meet an architecture you have never read — a MIPS router firmware, a RISC-V
microcontroller dump — the method is always the same:

1. **Grab the reference.** Find the ISA's instruction encoding, register set, calling
   convention, and **endianness** (MIPS is often big-endian — bytes and words can be
   reversed from what you expect).
2. **Find the shape.** Locate function prologues and epilogues and the calling convention:
   which registers pass arguments, which holds the return value, how the return address is
   saved.
3. **Follow control flow.** Identify the branch and call instructions and how system calls
   are made — that is enough to map the program.
4. **Lean on fixed width.** On RISC, disassembly is reliable, so linear or recursive
   decoding just works; spend your energy on semantics, not on finding instruction
   boundaries.
5. **Emulate to confirm.** Run tricky sequences in an emulator for that ISA and watch the
   registers, exactly as you did for x86.

RISC vs CISC, fixed vs variable width, the load/store rule, and a repeatable method for any
new ISA — architecture is no longer a wall between you and the code. That closes the
Advanced level: obfuscation, flattening, custom VMs, packing, self-modifying code, and the
wider world of CPUs.
'''
