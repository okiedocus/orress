title = "Other CPU architectures"
summary = "When the binary isn't x86: RISC vs CISC, fixed-width instructions, the load/store model, and stepping into ARM64."
badge = "Polyglot"
goals = [
    "contrast RISC and CISC and know which architectures are which",
