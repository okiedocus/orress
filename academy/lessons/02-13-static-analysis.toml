id = "l2-static-analysis"
level = 2
order = 13
title = "Finding your way in"
summary = "The static-analysis map: the parts of an executable, and how to go from a string straight to the code that matters."
badge = "Navigator"

[[steps]]
title = "Read, don't run"
text = '''
Welcome to Static Analysis. **Static** analysis means understanding a program by **examining it, without running it**. It's where you always start, for three reasons: it's **safe** (nothing executes, so malware can't bite), it's **complete** (you can see every code path, not just the one a single run happened to take), and it needs nothing but the file itself.

The challenge is scale. A stripped binary is thousands of anonymous functions with no names and no comments — a city with the street signs torn down. You can't read it front to back. You need a **map** and a way to head straight for the interesting part. That's this lesson.
'''

[[steps]]
title = "Anatomy of an executable"
text = '''
A binary isn't a shapeless blob — it has a structure the operating system's loader understands. The two big formats are **PE** (Windows `.exe`/`.dll`) and **ELF** (Linux, Android, BSD). Both carry the same ideas:

- A **header**: the architecture, and the **entry point** (where execution begins).
- **Sections**, each with a job:
  - **`.text`** — the executable machine **code**.
  - **`.rodata`** / `.rdata` — read-only **constants and strings**.
  - **`.data`** — writable globals with initial values.
  - **`.bss`** — globals that start as zero.
- An **import table** — the external library functions the program calls (e.g. `printf`, `strcmp`, `VirtualAlloc`).

ORRESS's **"What Is This File?"** view lays all of this out: format, architecture, the section map, and the imports.
'''

[[steps]]
title = "Where's the code?"
text = '''
Knowing the sections pays off immediately — it tells you where to look for different things.

Which section normally holds the executable machine code? (Give it with its leading dot.)
'''
check = { kind = "answer", answers = [".text", "text"], number = false, case_sensitive = false }
hints = ["It's the one whose name is short for \"text\" (an old Unix term for code).", "Code lives in .text; read-only strings live in .rodata."]
success = "`.text` — that's the code section. Strings sit in .rodata, writable globals in .data, and zero-initialised ones in .bss."

[[steps]]
title = "Where do you start?"
text = '''
You've got a stripped binary: no function names, thousands of blocks. Reading it all is hopeless. What's the most productive way to find the code that matters?
'''
check = { kind = "choice", options = [
  "Find a meaningful string (a prompt, an error, a format) and follow its cross-reference to the code that uses it",
  "Read every function from top to bottom until something looks interesting",
  "Start at the lowest address and work upward",
  "Rename functions at random until the names make sense",
], correct = 0 }
hints = [
  "Strings survive compilation and are tied to the code that uses them.",
  "A string like \"Enter password:\" is referenced by exactly the code that prints it.",
]
success = "Right — pivot from a telling string to its cross-reference. That jumps you straight to the relevant code instead of reading the whole program."

[[steps]]
title = "Strings: the fastest lead"
text = '''
The **Strings** view lists the human-readable text embedded in the binary: prompts like `Enter password:`, error messages, URLs, format strings, file paths. These survive compilation intact, and each one is used by some specific piece of code.

That's the lead. Spot `Enter password:` and its **cross-references** (xrefs) — every place in the code that mentions it — take you to the exact routine that prints it, which is almost certainly next to the check you care about. ORRESS's **Cross-references** view shows who references the item under your cursor, so you hop from the string to the code in one click.

Open the **Strings** view (the File menu, or the command palette) and skim for something meaningful.
'''
check = { kind = "action", id = "file::Strings" }
hints = ["Ctrl+Shift+P, then type \"Strings\" — or the File menu."]

[[steps]]
title = "A map of static analysis"
text = '''
Put the pieces into a repeatable loop:

1. **Orient.** Open "What Is This File?" — note the format (PE/ELF), architecture, sections and imports. The imports alone hint at behaviour (`socket` means networking, `CryptEncrypt` means crypto).
2. **Find a lead.** Scan the **Strings** for a telling message, or pick a suspicious **import**.
3. **Pivot with cross-references.** Jump from that string or import to the code that uses it — straight to the interesting function.
4. **Read it.** Use the **graph view** to see its control flow and the **decompiler** to read it as pseudocode (each has its own lesson).
5. **Record what you learn.** Rename functions and add comments as you understand them, so the map fills in.
6. **Repeat outward**, following calls and references.

You don't read a binary cover to cover — you anchor on something meaningful and expand from there. Orient, find a lead, pivot, read, annotate. That's how a wall of anonymous code becomes a program you understand.
'''
