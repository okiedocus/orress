version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch routine minor/patch bumps into one PR; security updates still come individually.
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Held on the yara-x 1.7 line (wasmtime 36 LTS) on purpose — see crates/orress-triage/Cargo.toml.
      - dependency-name: "yara-x*"
      - dependency-name: "wasmtime*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
