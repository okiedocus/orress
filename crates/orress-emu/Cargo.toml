[package]
name = "orress-emu"
description = "ORRESS pure-Rust x86/x64 emulator: run a function, count instructions, side-channel solving"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
iced-x86.workspace = true

[dev-dependencies]
# The assembler (code_asm) builds readable test functions; feature-unified with the main dep.
iced-x86 = { version = "1.21", features = ["code_asm"] }
