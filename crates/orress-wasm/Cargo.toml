[package]
name = "orress-wasm"
description = "ORRESS WebAssembly loader: parse a .wasm module's structure and disassemble it to WAT"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Pinned to the versions already in the lockfile (pulled by wasmtime/yara-x) so we
# don't introduce a third copy of the wasm-tools crates.
wasmparser = "=0.239.0"
wasmprinter = "=0.239.0"

[dev-dependencies]
wasm-encoder = "=0.239.0"
