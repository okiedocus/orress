[package]
name = "orress-ext"
description = "WASM extension host for ORRESS (wasmtime component model) + Zed-extension asset loading"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# wasmtime 36 is a long-term-support series (patched through 2027); keep it in step with the
# wasmtime that yara-x uses (orress-triage) so only one copy is built.
wasmtime = { version = "36.0.17", default-features = false, features = ["runtime", "cranelift", "component-model"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
ureq = { version = "3", features = ["json"] }
flate2 = "1"
tar = "0.4"
orress-archive.workspace = true
orress-theme.workspace = true
orress-lsp.workspace = true
wasmtime-wasi = { version = "36.0.17", default-features = false }

[dev-dependencies]
wasm-encoder = "0.240"
