# cargo-deny policy for ORRESS — run with `cargo deny check`. CI runs it on every push and pull
# request, and daily so newly published advisories are caught. See CONTRIBUTING.md.

[graph]
all-features = true

[advisories]
# Fail on any vulnerability. "Unmaintained" notices are reported only for crates we depend on
# directly; transitive ones (from egui, yara-x, rhai, yrs) are tracked upstream.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Marvin attack: a timing side channel in RSA *decryption and signing* with a private key.
    # rsa is only used by yara-x to *verify* Authenticode signatures with public keys, which the
    # attack does not affect. No fixed rsa release exists yet.
    { id = "RUSTSEC-2023-0071", reason = "public-key signature verification only (yara-x); not affected" },
    # yara-x `Rules::deserialize` is unsound on untrusted bytes (fixed in 1.19, which needs an
    # unpatched wasmtime). ORRESS never deserializes compiled rules — it compiles from source.
    { id = "GHSA-2jx3-ff3v-j7jj", reason = "Rules::deserialize is never called by ORRESS" },
]

[licenses]
# Permissive and weak-copyleft licenses compatible with distributing ORRESS under MIT/Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are not published to crates.io.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
