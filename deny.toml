# cargo-deny policy for ORRESS — run with `cargo deny check`. CI runs it on every push and pull
# request, and daily so newly published advisories are caught. See CONTRIBUTING.md.

[graph]
all-features = true

[advisories]
# Fail on any vulnerability. "Unmaintained" notices are reported only for crates we depend on
# directly; transitive ones (from egui, yara-x, rhai, yrs) are tracked upstream.
unmaintained = "workspace"
yanked = "deny"
# No exceptions, and that is the point of the yara-x 1.24 / wasmtime 48 upgrade rather than a
# happy accident. There were two, both reaching ORRESS only through yara-x's Authenticode
# verification: RUSTSEC-2023-0071 (rsa, the Marvin attack) and RUSTSEC-2026-0387 (crypto-bigint,
# timing variability). Neither applied -- the path is public-key *verification*, so there is no
# secret to leak -- but both had to be argued on every advisory-database update, and the second
# could not be fixed at all while yara-x 1.7 pinned the subtree.
#
# yara-x 1.24 takes rsa 0.10 and p256 0.14, which are the patched versions, so the argument is
# retired rather than restated. It also moves past GHSA-2jx3-ff3v-j7jj (unsound
# `Rules::deserialize`, fixed in 1.19), which was the third thing being argued instead of fixed.
#
# Keep this empty. An entry here is a vulnerability shipped deliberately, so it needs what those
# two had: the path, why it does not apply, and what would remove it.
ignore = []

[licenses]
# Permissive and weak-copyleft licenses compatible with distributing ORRESS under MIT/Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are not published to crates.io.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
